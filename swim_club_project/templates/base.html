    <style>

        /* =========================================================
           MOBİL UYGULAMA TEMELİ
        ========================================================== */

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }


        body {
            overflow: hidden;

            background: #111827;

            overscroll-behavior: none;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }


        button,
        a,
        label {
            touch-action: manipulation;
        }


        /* =========================================================
           ANA UYGULAMA
        ========================================================== */

        .app {

            width: 100%;
            height: 100dvh;

            max-width: 520px;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            margin: 0 auto;

            background: oklch(var(--b2));
        }


        /* Masaüstünde telefon/tablet görünümü */

        @media (min-width: 768px) {

            .app {

                height: calc(100dvh - 32px);

                margin-top: 16px;
                margin-bottom: 16px;

                border: 1px solid oklch(var(--b3));

                border-radius: 28px;

                overflow: hidden;

                box-shadow:
                    0 25px 60px rgba(0, 0, 0, .25);
            }

        }


        /* =========================================================
           HEADER
        ========================================================== */

        .app-header {

            flex-shrink: 0;

            padding-top: env(safe-area-inset-top);

            background: oklch(var(--b1) / .94);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom:
                1px solid oklch(var(--b3) / .7);

            z-index: 40;
        }


        .header-inner {

            height: 56px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 12px;
        }


        .header-button {

            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            transition:
                background .15s ease,
                transform .1s ease;
        }


        .header-button:active {

            background: oklch(var(--bc) / .08);

            transform: scale(.94);
        }


        /* =========================================================
           LOGO
        ========================================================== */

        .app-logo {

            width: 34px;
            height: 34px;

            flex-shrink: 0;

            border-radius: 10px;

            object-fit: cover;

            box-shadow:
                0 2px 6px rgba(0, 0, 0, .12);
        }


        /* =========================================================
           CONTENT
        ========================================================== */

        .app-content {

            flex: 1;

            min-height: 0;

            overflow-x: hidden;
            overflow-y: auto;

            -webkit-overflow-scrolling: touch;

            overscroll-behavior-y: contain;

            padding: 14px;

            padding-bottom: 20px;
        }


        .app-content::-webkit-scrollbar {
            display: none;
        }


        .app-content {
            scrollbar-width: none;
        }


        /* =========================================================
           BOTTOM NAVIGATION
        ========================================================== */

        .bottom-nav {

            flex-shrink: 0;

            padding-bottom: env(safe-area-inset-bottom);

            background: oklch(var(--b1) / .96);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-top:
                1px solid oklch(var(--b3) / .7);

            z-index: 40;
        }


        .bottom-nav-inner {

            height: 64px;

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            padding: 4px 6px;
        }


        .bottom-nav-item {

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 2px;

            border-radius: 14px;

            color:
                oklch(var(--bc) / .48);

            font-size: 9px;
            font-weight: 700;

            text-decoration: none;

            transition:
                background .15s ease,
                color .15s ease,
                transform .1s ease;
        }


        .bottom-nav-item:active {

            transform: scale(.94);
        }


        .bottom-nav-item.active {

            color: oklch(var(--p));
        }


        .bottom-nav-item.active .nav-icon {

            background:
                oklch(var(--p) / .12);
        }


        .nav-icon {

            width: 38px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            transition:
                background .15s ease;
        }


        .nav-icon svg {

            width: 20px;
            height: 20px;
        }


        /* =========================================================
           DROPDOWN
        ========================================================== */

        .dropdown-content {

            animation:
                menuIn .12s ease-out;
        }


        @keyframes menuIn {

            from {
                opacity: 0;
                transform: translateY(-4px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        /* =========================================================
           MOBİL DOKUNMA
        ========================================================== */

        input,
        select,
        textarea,
        button {

            -webkit-appearance: none;
        }

    </style>


    <!-- =========================================================
         PARA INPUTLARI
    ========================================================== -->

    <script>

        (function () {


            function formatMoneyInput(input) {

                const raw =
                    input.value.replace(/\s/g, '');

                if (!raw) return;


                const separator =
                    Math.max(
                        raw.lastIndexOf(','),
                        raw.lastIndexOf('.')
                    );


                const hasDecimal =
                    separator >= 0 &&
                    raw.length - separator - 1 <= 2;


                const integerPart =
                    (
                        hasDecimal
                            ? raw.slice(0, separator)
                            : raw
                    )
                    .replace(/\D/g, '')
                    || '0';


                const decimalPart =
                    hasDecimal
                        ? raw
                            .slice(separator + 1)
                            .replace(/\D/g, '')
                            .slice(0, 2)
                        : '';


                const formattedInteger =
                    integerPart.replace(
                        /\B(?=(\d{3})+(?!\d))/g,
                        '.'
                    );


                input.value =
                    hasDecimal
                        ? `${formattedInteger},${decimalPart}`
                        : formattedInteger;
            }



            function normalizeMoneyValue(value) {

                const raw =
                    value.replace(/\s/g, '');

                if (!raw) return '';


                const separator =
                    Math.max(
                        raw.lastIndexOf(','),
                        raw.lastIndexOf('.')
                    );


                const hasDecimal =
                    separator >= 0 &&
                    raw.length - separator - 1 <= 2;


                const integerPart =
                    (
                        hasDecimal
                            ? raw.slice(0, separator)
                            : raw
                    )
                    .replace(/\D/g, '')
                    || '0';


                const decimalPart =
                    hasDecimal
                        ? raw
                            .slice(separator + 1)
                            .replace(/\D/g, '')
                            .slice(0, 2)
                            .padEnd(2, '0')
                        : '00';


                return `${integerPart}.${decimalPart}`;
            }



            function prepareMoneyInputs(root) {

                if (!root || !root.querySelectorAll) {
                    return;
                }


                root
                    .querySelectorAll(
                        '[data-money-input="true"]'
                    )
                    .forEach(function (input) {

                        if (input.dataset.moneyReady) {
                            return;
                        }


                        input.dataset.moneyReady = 'true';


                        formatMoneyInput(input);


                        input.addEventListener(
                            'input',
                            function () {

                                const cursorAtEnd =
                                    input.selectionStart ===
                                    input.value.length;


                                formatMoneyInput(input);


                                if (cursorAtEnd) {

                                    input.setSelectionRange(
                                        input.value.length,
                                        input.value.length
                                    );

                                }

                            }
                        );


                        input.addEventListener(
                            'blur',
                            function () {

                                if (input.value) {
                                    formatMoneyInput(input);
                                }

                            }
                        );

                    });
            }



            document.addEventListener(
                'DOMContentLoaded',
                function () {

                    prepareMoneyInputs(document);

                }
            );



            document.addEventListener(
                'htmx:afterSwap',
                function (event) {

                    prepareMoneyInputs(event.target);

                }
            );



            document.addEventListener(
                'submit',
                function (event) {

                    event.target
                        .querySelectorAll(
                            '[data-money-input="true"]'
                        )
                        .forEach(function (input) {

                            input.value =
                                normalizeMoneyValue(
                                    input.value
                                );

                        });

                },
                true
            );


        })();

    </script>

</head>
