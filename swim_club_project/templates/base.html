{% load static %}

<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#E9EAEC"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <link
        rel="manifest"
        href="{% static 'manifest.json' %}"
    >

    <link
        rel="apple-touch-icon"
        href="{% static 'icons/icon-192.png' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/app.css' %}"
    >

    <title>
        {% block title %}ALPHA ACADEMY{% endblock %}
    </title>

    {% block extra_head %}{% endblock %}

</head>


<body>
<div id="app" class="app">

    {% include "components/app/topbar.html" %}

    <main class="app-content">
        <div class="app-main">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% include "components/app/bottom-nav.html" %}

</div>


    <!-- =====================================================
         GLOBAL MODAL
         ===================================================== -->

    <div
        id="modal-container"
        class="app-overlay"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         GLOBAL TOAST
         ===================================================== -->

    <div
        id="toast-container"
        class="app-toast-container"
    ></div>


    <!-- =====================================================
         GLOBAL LOADING
         ===================================================== -->

    <div
        id="global-loading"
        class="app-loading"
        aria-hidden="true"
    >

        <span class="app-loading-spinner"></span>

    </div>


    <script
        src="{% static 'js/htmx.min.js' %}"
        defer
    ></script>

    <script
        src="{% static 'js/app.js' %}"
        defer
    ></script>

    {% block extra_js %}{% endblock %}

</body>

</html>
