<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kulüp Yönetim Paneli</title>
    <!-- Tailwind CSS + DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <script>
        (function () {
            function formatMoneyInput(input) {
                const raw = input.value.replace(/\s/g, '');
                if (!raw) return;

                const separator = Math.max(raw.lastIndexOf(','), raw.lastIndexOf('.'));
                const hasDecimal = separator >= 0 && raw.length - separator - 1 <= 2;
                const integerPart = (hasDecimal ? raw.slice(0, separator) : raw).replace(/\D/g, '') || '0';
                const decimalPart = hasDecimal ? raw.slice(separator + 1).replace(/\D/g, '').slice(0, 2) : '';
                const formattedInteger = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                input.value = hasDecimal ? `${formattedInteger},${decimalPart}` : formattedInteger;
            }

            function normalizeMoneyValue(value) {
                const raw = value.replace(/\s/g, '');
                if (!raw) return '';
                const separator = Math.max(raw.lastIndexOf(','), raw.lastIndexOf('.'));
                const hasDecimal = separator >= 0 && raw.length - separator - 1 <= 2;
                const integerPart = (hasDecimal ? raw.slice(0, separator) : raw).replace(/\D/g, '') || '0';
                const decimalPart = hasDecimal ? raw.slice(separator + 1).replace(/\D/g, '').slice(0, 2).padEnd(2, '0') : '00';
                return `${integerPart}.${decimalPart}`;
            }

            function prepareMoneyInputs(root) {
                root.querySelectorAll('[data-money-input="true"]').forEach(function (input) {
                    if (input.dataset.moneyReady) return;
                    input.dataset.moneyReady = 'true';
                    formatMoneyInput(input);
                    input.addEventListener('input', function () {
                        const cursorAtEnd = input.selectionStart === input.value.length;
                        formatMoneyInput(input);
                        if (cursorAtEnd) input.setSelectionRange(input.value.length, input.value.length);
                    });
                    input.addEventListener('blur', function () {
                        if (input.value) formatMoneyInput(input);
                    });
                });
            }

            document.addEventListener('DOMContentLoaded', function () {
                prepareMoneyInputs(document);
            });
            document.addEventListener('htmx:afterSwap', function (event) {
                prepareMoneyInputs(event.target);
            });
            document.addEventListener('submit', function (event) {
                event.target.querySelectorAll('[data-money-input="true"]').forEach(function (input) {
                    input.value = normalizeMoneyValue(input.value);
                });
            }, true);
        })();
    </script>
</head>
<body class="bg-base-200 min-h-screen" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <header class="sticky top-0 z-40 border-b border-base-300 bg-base-100/95 shadow-sm backdrop-blur">
        <div class="navbar mx-auto max-w-7xl px-4 sm:px-6">
            <div class="navbar-start">
                <div class="dropdown">
                    <label tabindex="0" class="btn btn-ghost btn-circle lg:hidden" aria-label="Menüyü aç">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </label>
                    <ul tabindex="0" class="menu dropdown-content z-[1] mt-3 w-56 rounded-box border border-base-300 bg-base-100 p-2 shadow-xl">
                        <li><a href="{% url 'dashboard-index' %}">Dashboard</a></li>
                        <li><a href="{% url 'team-list' %}">Takımlar</a></li>
                        <li><a href="{% url 'athlete-manage-list' %}">Sporcular</a></li>
                        <li><a href="{% url 'finance-dashboard' %}">Finans</a></li>
                    </ul>
                </div>
                <a href="{% url 'dashboard-index' %}" class="btn btn-ghost gap-2 px-2 text-lg font-black text-gray-700 sm:text-xl">
                    <img src="/media/logos/fk1.png" alt="Spor Kulübü" class="h-10 w-10 rounded-lg object-cover">
                    <span class="hidden sm:inline">Alphaacademy</span>
                </a>
            </div>

            <nav class="navbar-center hidden lg:flex">
                <ul class="menu menu-horizontal gap-1 px-1 font-semibold">
                    <li><a href="{% url 'dashboard-index' %}">Dashboard</a></li>
                    <li><a href="{% url 'team-list' %}">Takımlar</a></li>
                    <li><a href="{% url 'athlete-manage-list' %}">Sporcular</a></li>
                    <li><a href="{% url 'finance-dashboard' %}">Finans</a></li>
                </ul>
            </nav>

            <div class="navbar-end gap-1 sm:gap-2">
                <nav class="flex items-center gap-1 lg:hidden" aria-label="Hızlı menü">
                    <a href="{% url 'athlete-manage-list' %}" class="btn btn-ghost btn-xs px-1.5 text-xs">Sporcular</a>
                    <a href="{% url 'finance-dashboard' %}" class="btn btn-ghost btn-xs px-1.5 text-xs">Finans</a>
                </nav>
                <div class="hidden text-right sm:block">
                    <p class="max-w-32 truncate text-sm font-bold">{{ request.user.get_full_name|default:request.user.username }}</p>
                    <p class="text-xs text-base-content/50">{{ request.user.get_role_display }}</p>
                </div>
                <div class="dropdown dropdown-end">
                    <label tabindex="0" class="btn btn-circle avatar placeholder" aria-label="Kullanıcı menüsü">
                        <div class="w-9 rounded-full bg-primary text-primary-content"><span>{{ request.user.first_name|first|default:request.user.username|first|upper }}</span></div>
                    </label>
                    <ul tabindex="0" class="menu dropdown-content z-[1] mt-3 w-48 rounded-box border border-base-300 bg-base-100 p-2 shadow-xl">
                        <li><a href="{% url 'user-logout' %}" class="text-error">Çıkış yap</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="container mx-auto p-6">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
