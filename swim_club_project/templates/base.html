<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kulüp Yönetim Paneli</title>
    <!-- Tailwind CSS + DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
</head>
<body class="bg-base-200 min-h-screen" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <!-- Navbar -->
    <div class="navbar bg-base-100 shadow-md px-6">
        <div class="flex-1">
            <a class="btn btn-ghost text-xl font-bold text-primary">Spor Kulübü Paneli</a>
        </div>
        <div class="flex-none gap-2">
            <span class="badge badge-primary">{{ request.user.get_full_name|default:request.user.username }}</span>
        </div>
    </div>

    <!-- Main Content Container -->
    <main class="container mx-auto p-6">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
