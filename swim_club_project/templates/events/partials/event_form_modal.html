<dialog id="event_modal" class="ui-modal" data-modal-backdrop-close="true">
    <div class="ui-modal-panel">
        <header class="ui-modal-header">
            <div class="min-w-0">
                <p class="ui-modal-eyebrow">Kulüp takvimi</p>
                <h2 class="ui-modal-title">{{ title }}</h2>
                <p class="ui-modal-description">Etkinlik bilgilerini ve dosyalarını kaydedin.</p>
            </div>
            <button type="button" class="ui-modal-close" data-modal-close aria-label="Kapat">
                <span aria-hidden="true">×</span>
            </button>
        </header>

        <form 
              enctype="multipart/form-data"
              {% if event %}
              hx-post="{% url 'event-update' event.pk %}"
              {% else %}
              hx-post="{% url 'event-create' %}"
              hx-target="#event-list"
              {% endif %}
              
              hx-swap="outerHTML"
              hx-encoding="multipart/form-data"
              class="ui-modal-form">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="ui-error">{{ form.non_field_errors }}</div>
            {% endif %}

            {% for field in form %}
                <label class="ui-field">
                    <span class="ui-label">{{ field.label }}</span>
                    {{ field }}
                    {% if field.errors %}
                        <span class="ui-error">{{ field.errors|striptags }}</span>
                    {% endif %}
                </label>
            {% endfor %}



            <div class="ui-modal-actions">
                <button type="button" class="ui-btn ui-btn-secondary" data-modal-close>İptal</button>
                <button type="submit" class="ui-btn ui-btn-primary">Kaydet</button>
            </div>
        </form>
    </div>
</dialog>
