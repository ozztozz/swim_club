<section id="event-list" class="ui-list">
    {% for event in events %}
        <a href="{% url 'event-detail' event.pk %}" class="ui-list-item">
            <div class="ui-list-content">
                <p class="ui-list-title">{{ event.name }}</p>
                <p class="ui-list-subtitle">{{ event.event_date|date:"d.m.Y" }} · {{ event.place }}</p>
                <p class="ui-list-meta">{{ event.age_group_start }} - {{ event.age_group_end }}</p>
            </div>
            <div class="ui-list-end">
                <span class="ui-badge ui-badge-neutral">{{ event.get_pool_type_display }}</span>
            </div>
        </a>
    {% empty %}
        <div class="ui-empty">
            <p class="ui-empty-description">Henüz yarışma veya etkinlik kaydı yok.</p>
        </div>
    {% endfor %}
</section>
