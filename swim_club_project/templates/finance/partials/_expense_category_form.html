<div id="category-field" class="rounded-xl border border-primary/25 bg-primary/5 p-3 sm:col-span-2">
    <div class="mb-3 flex items-center justify-between gap-3">
        <div>
            <p class="text-sm font-bold">Yeni kategori ekle</p>
            <p class="text-xs text-base-content/55">Kaydettikten sonra kategori listede seçili gelir.</p>
        </div>
        <button type="button"
                class="btn btn-ghost btn-xs"
            hx-get="{% url 'expense-category-create' %}?cancel=1"
            hx-target="#category-field"
            hx-swap="outerHTML"
                aria-label="Kategori eklemeyi iptal et">İptal</button>
    </div>
    <form hx-post="{% url 'expense-category-create' %}"
          hx-target="#category-field"
          hx-swap="outerHTML"
          class="space-y-3">
        {% csrf_token %}
        <label class="form-control">
            <span class="label label-text text-xs font-bold">Kategori adı</span>
            {{ form.name }}
            {% if form.name.errors %}<span class="label-text-alt text-error">{{ form.name.errors|striptags }}</span>{% endif %}
        </label>
        <label class="form-control">
            <span class="label label-text text-xs font-bold">Açıklama</span>
            {{ form.description }}
        </label>
        <button type="submit" class="btn btn-primary btn-sm">Kategoriyi kaydet</button>
    </form>
</div>
