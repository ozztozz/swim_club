<fieldset
    id="category-field"
    class="form-control min-w-0 max-w-full sm:col-span-2"
>
    <div class="mb-2 flex items-center justify-between gap-3">

        <legend class="text-[11px] font-bold text-base-content/65">
            Harcama kategorisi
        </legend>

        <button
            type="button"
            class="btn btn-ghost h-7 min-h-0 shrink-0 gap-1 rounded-lg px-2 text-[10px] font-semibold text-primary/80 hover:bg-primary/10 hover:text-primary"
            hx-get="{% url 'expense-category-create' %}"
            hx-target="#category-field"
            hx-swap="outerHTML"
        >
            <span class="text-sm leading-none">+</span>
            Yeni kategori
        </button>

    </div>

    <div class="flex min-w-0 flex-wrap gap-1.5">

        {% for radio in form.category %}

            <label
                class="flex h-8 cursor-pointer items-center gap-1.5 rounded-xl border border-base-300/80 bg-base-100 px-2.5 transition-all active:scale-[.98] has-[:checked]:border-primary/40 has-[:checked]:bg-primary/10 has-[:checked]:text-primary"
            >

                {{ radio.tag }}

                <span class="text-[10px] font-medium">
                    {{ radio.choice_label }}
                </span>

            </label>

        {% endfor %}

    </div>

    {% if form.category.errors %}
        <span class="mt-1 text-[10px] font-medium text-error">
            {{ form.category.errors|striptags }}
        </span>
    {% endif %}

</fieldset>
