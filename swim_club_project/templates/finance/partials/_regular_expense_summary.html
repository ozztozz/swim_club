<section id="regular-expense-summary"
         {% if oob %} hx-swap-oob="outerHTML"{% endif %}
         class="ui-stat-grid mb-6">
    <div class="ui-stat">
        <span class="ui-stat-label ui-text-success">Ödenen</span>
        <strong class="ui-stat-value ui-text-success">{{ regular_paid_total|floatformat:0 }} TL</strong>
        <span class="ui-stat-description">Seçilen dönem</span>
    </div>
    <div class="ui-stat">
        <span class="ui-stat-label ui-text-warning">Bekleyen</span>
        <strong class="ui-stat-value ui-text-warning">{{ regular_pending_total|floatformat:0 }} TL</strong>
        <span class="ui-stat-description">Seçilen dönem</span>
    </div>
    <div class="ui-stat">
        <span class="ui-stat-label">Tanımlı toplam</span>
        <strong class="ui-stat-value">{{ regular_expense_total|floatformat:0 }} TL</strong>
        <span class="ui-stat-description">{{ regular_expense_count }} aktif plan</span>
    </div>
</section>
