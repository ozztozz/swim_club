<dialog id="equipment_stock_modal" class="ui-modal" data-modal-backdrop-close="true">
    <div class="ui-modal-panel">
        <div class="ui-modal-header">
            <div>
                <p class="ui-modal-eyebrow">Stok hareketi</p>
                <h3 class="ui-modal-title">Malzeme işlemi</h3>
                <p class="ui-modal-description">Tek işlemle stoğu güncelleyin.</p>
            </div>
            <button type="button"
                    class="ui-modal-close" data-modal-close aria-label="Kapat">✕</button>
        </div>
        <form method="post"
              hx-post="{% url 'equipment-stock' %}"
              hx-target="#modal-container"
              hx-swap="innerHTML"
              class="ui-modal-form">
            {% csrf_token %}
            <fieldset>
                <legend class="mb-1.5 text-[10px] font-bold text-base-content/60">İşlem türü</legend>
                <div class="grid grid-cols-2 gap-1.5">
                    <label class="flex cursor-pointer items-center gap-1.5 rounded-xl border border-base-300 px-2.5 py-2 text-[10px] has-[:checked]:border-primary has-[:checked]:bg-primary/10">
                        <input type="radio" name="action" value="stock_in" checked>Stok girişi
                    </label>
                    <label class="flex cursor-pointer items-center gap-1.5 rounded-xl border border-base-300 px-2.5 py-2 text-[10px] has-[:checked]:border-primary has-[:checked]:bg-primary/10">
                        <input type="radio" name="action" value="coach_transfer">Antrenöre teslim
                    </label>
                    <label class="flex cursor-pointer items-center gap-1.5 rounded-xl border border-base-300 px-2.5 py-2 text-[10px] has-[:checked]:border-primary has-[:checked]:bg-primary/10">
                        <input type="radio" name="action" value="athlete_distribution">Sporcuya dağıtım
                    </label>
                    <label class="flex cursor-pointer items-center gap-1.5 rounded-xl border border-base-300 px-2.5 py-2 text-[10px] has-[:checked]:border-primary has-[:checked]:bg-primary/10">
                        <input type="radio" name="action" value="coach_return">Antrenörden iade
                    </label>
                </div>
            </fieldset>
            <label class="form-control"><span class="mb-1.5 text-[10px] font-bold text-base-content/60">Malzeme</span><select name="equipment"
        class="select select-bordered h-10 min-h-0 w-full text-xs"
        required><option value="">Malzeme seçin</option>{% for equipment in equipments %}<option value="{{ equipment.pk }}">{{ equipment.display_name }}{% if equipment.variant_summary %} ({{ equipment.variant_summary }}){% endif %}</option>{% endfor %}</select></label>
            <label id="stock-coach-field" class="form-control hidden"><span class="mb-1.5 text-[10px] font-bold text-base-content/60">Antrenör</span><select name="coach"
        class="select select-bordered h-10 min-h-0 w-full text-xs"><option value="">Antrenör seçin</option>{% for coach in coaches %}<option value="{{ coach.pk }}">{{ coach.get_full_name|default:coach.email }}</option>{% endfor %}</select></label>
            <label id="stock-athlete-field" class="form-control hidden"><span class="mb-1.5 text-[10px] font-bold text-base-content/60">Sporcu</span><select name="athlete"
        class="select select-bordered h-10 min-h-0 w-full text-xs"><option value="">Sporcu seçin</option>{% for athlete in athletes %}<option value="{{ athlete.pk }}">{{ athlete.get_full_name }}</option>{% endfor %}</select></label>
            <label class="form-control">
                <span class="mb-1.5 text-[10px] font-bold text-base-content/60">Adet</span><input name="quantity"
       type="number"
       min="1"
       step="1"
       class="input input-bordered h-10 w-full text-xs"
       required>
            </label>
            <label class="form-control">
                <span class="mb-1.5 text-[10px] font-bold text-base-content/60">Not</span><input name="notes"
       class="input input-bordered h-10 w-full text-xs"
       placeholder="İsteğe bağlı">
            </label>
            <div class="ui-modal-actions">
                <button type="button"
                        class="ui-btn ui-btn-secondary" data-modal-close>Vazgeç</button><button type="submit" class="ui-btn ui-btn-primary">Kaydet</button>
            </div>
        </form>
    </div>
</dialog>
<script>
    (() => {
        const modal = document.getElementById('equipment_stock_modal');
        const coach = document.getElementById('stock-coach-field');
        const athlete = document.getElementById('stock-athlete-field');
        const sync = () => {
            const action = modal.querySelector('input[name="action"]:checked').value;
            coach.classList.toggle('hidden', action === 'stock_in');
            athlete.classList.toggle('hidden', action !== 'athlete_distribution');
        };
        modal.querySelectorAll('input[name="action"]').forEach((input) => input.addEventListener('change', sync));
        sync();
    })();
</script>
