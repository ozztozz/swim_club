<dialog id="equipment_stock_modal" class="modal modal-open">
    <div class="modal-box w-[calc(100%-1rem)] max-w-md rounded-2xl p-0">
        <div class="flex items-start justify-between gap-3 border-b border-base-200 px-4 py-4">
            <div><p class="text-[10px] font-black uppercase tracking-widest text-primary">Stok hareketi</p><h3 class="mt-1 text-lg font-black">Malzeme işlemi</h3><p class="mt-1 text-[10px] text-base-content/50">Tek işlemle stoğu güncelleyin.</p></div>
            <button type="button" class="btn btn-circle btn-ghost h-8 w-8 min-h-0" onclick="document.getElementById('equipment_stock_modal').remove()">✕</button>
        </div>
        <form method="post" hx-post="{% url 'equipment-stock' %}" hx-target="#equipment-stock-modal-container" hx-swap="innerHTML" class="space-y-3 px-4 py-4">
            {% csrf_token %}
            <fieldset><legend class="mb-1.5 text-[10px] font-bold text-base-content/60">İşlem türü</legend><div class="grid grid-cols-2 gap-1.5">
                <label class="flex cursor-pointer items-center gap-1.5 rounded-xl border border-base-300 px-2.5 py-2 text-[10px] has-[:checked]:border-primary has-[:checked]:bg-primary/10"><input type="radio" name="action" value="stock_in" checked>Stok girişi</label>
                <label class="flex cursor-pointer items-center gap-1.5 rounded-xl border border-base-300 px-2.5 py-2 text-[10px] has-[:checked]:border-primary has-[:checked]:bg-primary/10"><input type="radio" name="action" value="coach_transfer">Antrenöre teslim</label>
                <label class="flex cursor-pointer items-center gap-1.5 rounded-xl border border-base-300 px-2.5 py-2 text-[10px] has-[:checked]:border-primary has-[:checked]:bg-primary/10"><input type="radio" name="action" value="athlete_distribution">Sporcuya dağıtım</label>
                <label class="flex cursor-pointer items-center gap-1.5 rounded-xl border border-base-300 px-2.5 py-2 text-[10px] has-[:checked]:border-primary has-[:checked]:bg-primary/10"><input type="radio" name="action" value="coach_return">Antrenörden iade</label>
            </div></fieldset>
            <label class="form-control"><span class="mb-1.5 text-[10px] font-bold text-base-content/60">Malzeme</span><select name="equipment" class="select select-bordered h-10 min-h-0 w-full text-xs" required><option value="">Malzeme seçin</option>{% for equipment in equipments %}<option value="{{ equipment.pk }}">{{ equipment.name }}</option>{% endfor %}</select></label>
            <label id="stock-coach-field" class="form-control hidden"><span class="mb-1.5 text-[10px] font-bold text-base-content/60">Antrenör</span><select name="coach" class="select select-bordered h-10 min-h-0 w-full text-xs"><option value="">Antrenör seçin</option>{% for coach in coaches %}<option value="{{ coach.pk }}">{{ coach.get_full_name|default:coach.email }}</option>{% endfor %}</select></label>
            <label id="stock-athlete-field" class="form-control hidden"><span class="mb-1.5 text-[10px] font-bold text-base-content/60">Sporcu</span><select name="athlete" class="select select-bordered h-10 min-h-0 w-full text-xs"><option value="">Sporcu seçin</option>{% for athlete in athletes %}<option value="{{ athlete.pk }}">{{ athlete.get_full_name }}</option>{% endfor %}</select></label>
            <label class="form-control"><span class="mb-1.5 text-[10px] font-bold text-base-content/60">Adet</span><input name="quantity" type="number" min="1" step="1" class="input input-bordered h-10 w-full text-xs" required></label>
            <label class="form-control"><span class="mb-1.5 text-[10px] font-bold text-base-content/60">Not</span><input name="notes" class="input input-bordered h-10 w-full text-xs" placeholder="İsteğe bağlı"></label>
            <div class="grid grid-cols-2 gap-2 border-t border-base-200 pt-3"><button type="button" class="btn btn-ghost h-10 min-h-0 rounded-xl text-xs font-bold" onclick="document.getElementById('equipment_stock_modal').remove()">Vazgeç</button><button class="btn btn-primary h-10 min-h-0 rounded-xl text-xs font-bold">Kaydet</button></div>
        </form>
    </div>
</dialog>
<script>
    (() => {
        const modal = document.getElementById('equipment_stock_modal');
        const coach = document.getElementById('stock-coach-field');
        const athlete = document.getElementById('stock-athlete-field');
        const sync = () => {
            const action = modal.querySelector('input[name="action"]:checked').value;
            coach.classList.toggle('hidden', action === 'stock_in');
            athlete.classList.toggle('hidden', action !== 'athlete_distribution');
        };
        modal.querySelectorAll('input[name="action"]').forEach((input) => input.addEventListener('change', sync));
        sync();
    })();
</script>
