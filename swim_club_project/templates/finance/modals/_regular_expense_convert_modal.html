<dialog id="regular_expense_modal" class="modal modal-open">

    <div class="modal-box w-[calc(100%-1rem)] max-w-md max-h-[92vh] overflow-hidden rounded-2xl p-0">

        <!-- Başlık -->
        <div class="flex items-start justify-between gap-3 border-b border-base-200 px-4 py-4 sm:px-5">

            <div class="min-w-0">
                <p class="text-[10px] font-black uppercase tracking-widest text-primary">
                    Düzenli gider
                </p>

                <h3 class="mt-1 text-xl font-black text-base-content">
                    Harcamaya dönüştür
                </h3>

                <p class="mt-1 text-[10px] leading-relaxed text-base-content/50">
                    Gerçekleşen harcama kaydını oluşturun.
                </p>
            </div>

            <button
                type="button"
                class="btn btn-circle btn-ghost h-8 w-8 min-h-0 shrink-0 text-sm"
                onclick="closeRegularExpenseModal()"
                aria-label="Kapat">
                ✕
            </button>

        </div>


        <!-- Kaynak Gider Özeti -->
        <div class="mx-4 mt-4 overflow-hidden rounded-2xl border border-base-200 bg-base-200/50 sm:mx-5">

            <div class="px-4 py-3">

                <p class="text-[10px] text-base-content/40">
                    Kaynak düzenli gider
                </p>

                <p class="mt-0.5 truncate text-sm font-black text-base-content">
                    {{ regular_expense.reciever }}
                </p>

            </div>

            <div class="flex items-center justify-between border-t border-base-300 px-4 py-3">

                <span class="text-xs text-base-content/50">
                    Planlanan tutar
                </span>

                <strong class="text-sm font-black text-error">
                    {{ regular_expense.amount|floatformat:2 }} TL
                </strong>

            </div>

        </div>


        <!-- Form -->
        <form
            hx-post="{% url 'regular-expense-convert' regular_expense.pk %}"
            hx-target="{{ conversion_target|default:'#regular-expense-list' }}"
            hx-swap="outerHTML"
            class="max-h-[calc(92vh-185px)] overflow-y-auto px-4 py-4 sm:px-5">

            {% csrf_token %}

            <input type="hidden" name="conversion_source" value="{{ conversion_source }}">
            <input type="hidden" name="period" value="{{ period }}">
            <input type="hidden" name="category_filter" value="{{ category_filter }}">
            <input type="hidden" name="query_filter" value="{{ query_filter }}">
            <input type="hidden" name="status_filter" value="{{ status_filter }}">


            {% if form.non_field_errors %}
                <div class="alert alert-error mb-3 text-xs">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}


            <div class="space-y-3">

                <!-- Kategori -->
                <label class="form-control">

                    <span class="mb-1.5 text-[10px] font-bold text-base-content/60">
                        Kategori
                    </span>

                    {{ form.category }}

                    {% if form.category.errors %}
                        <span class="mt-1 text-[10px] text-error">
                            {{ form.category.errors }}
                        </span>
                    {% endif %}

                </label>


                <!-- Tutar + Tarih -->
                <div class="grid grid-cols-2 gap-2">

                    <label class="form-control">

                        <span class="mb-1.5 text-[10px] font-bold text-base-content/60">
                            Gerçekleşen tutar
                        </span>

                        {{ form.amount }}

                        {% if form.amount.errors %}
                            <span class="mt-1 text-[10px] text-error">
                                {{ form.amount.errors }}
                            </span>
                        {% endif %}

                    </label>


                    <label class="form-control">

                        <span class="mb-1.5 text-[10px] font-bold text-base-content/60">
                            Harcama tarihi
                        </span>

                        {{ form.expense_date }}

                        {% if form.expense_date.errors %}
                            <span class="mt-1 text-[10px] text-error">
                                {{ form.expense_date.errors }}
                            </span>
                        {% endif %}

                    </label>

                </div>


                <!-- Alıcı -->
                <label class="form-control">

                    <span class="mb-1.5 text-[10px] font-bold text-base-content/60">
                        Alıcı / firma
                    </span>

                    {{ form.reciever }}

                    {% if form.reciever.errors %}
                        <span class="mt-1 text-[10px] text-error">
                            {{ form.reciever.errors }}
                        </span>
                    {% endif %}

                </label>


                <!-- Açıklama -->
                <label class="form-control">

                    <span class="mb-1.5 text-[10px] font-bold text-base-content/60">
                        Açıklama
                    </span>

                    {{ form.notes }}

                    {% if form.notes.errors %}
                        <span class="mt-1 text-[10px] text-error">
                            {{ form.notes.errors }}
                        </span>
                    {% endif %}

                </label>

            </div>


            <!-- Aksiyonlar -->
            <div class="mt-4 grid grid-cols-2 gap-2 border-t border-base-200 pt-4">

                <button
                    type="button"
                    class="btn btn-ghost h-10 min-h-0 rounded-xl text-xs font-bold"
                    onclick="closeRegularExpenseModal()">
                    İptal
                </button>

                <button
                    type="submit"
                    class="btn btn-primary h-10 min-h-0 rounded-xl text-xs font-bold shadow-sm">
                    Harcamayı oluştur
                </button>

            </div>

        </form>

    </div>

</dialog>


<script>
    function closeRegularExpenseModal() {
        const modal = document.getElementById('regular_expense_modal');

        if (modal) {
            modal.remove();
        }

        const regularContainer = document.getElementById('regular-expense-modal-container');
        const expenseContainer = document.getElementById('modal-container');

        if (regularContainer) {
            regularContainer.innerHTML = '';
        }

        if (expenseContainer) {
            expenseContainer.innerHTML = '';
        }
    }
</script>
