<!-- finance/templates/finance/modals/_mark_paid_modal.html -->

<dialog id="payment_modal" class="modal modal-open">

    <div class="modal-box w-[calc(100%-1rem)] max-w-md rounded-2xl p-4 sm:p-5">

        <!-- Başlık -->
        <div>
            <p class="text-[10px] font-black uppercase tracking-widest text-primary">
                Ödeme tahsilatı
            </p>

            <h3 class="mt-1 text-xl font-black text-base-content">
                Ödemeyi tamamla
            </h3>
        </div>


        <!-- Ödeme Özeti -->
        <div class="mt-4 overflow-hidden rounded-2xl border border-base-200 bg-base-200/50">

            <div class="px-4 py-3">
                <p class="text-[10px] text-base-content/40">
                    Sporcu
                </p>

                <p class="mt-0.5 truncate text-sm font-bold">
                    {{ payment.athlete.get_full_name|default:"Genel Gelir" }}
                </p>
            </div>


            <div class="flex items-center justify-between border-t border-base-300 px-4 py-3">

                <span class="text-xs text-base-content/50">
                    Dönem
                </span>

                <span class="text-xs font-bold">
                    {{ payment.period }}
                </span>

            </div>


            <div class="flex items-center justify-between border-t border-base-300 px-4 py-3">

                <span class="text-xs text-base-content/50">
                    Tahsil edilecek
                </span>

                <strong class="text-lg font-black text-primary">
                    {{ payment.amount|floatformat:2 }} TL
                </strong>

            </div>

        </div>


        <!-- Form -->
        <form
            hx-post="{% url 'finance-mark-paid' payment.id %}"
            hx-target="#payment-row-{{ payment.id }}"
            hx-swap="outerHTML"
            class="mt-4 space-y-3">

            {% csrf_token %}


            <!-- Ödeme yöntemi -->
            <label class="form-control">

                <span class="mb-1.5 text-[10px] font-bold text-base-content/60">
                    Ödeme yöntemi
                </span>

                {{ form.payment_method }}

                {% if form.payment_method.errors %}
                    <span class="mt-1 text-[10px] text-error">
                        {{ form.payment_method.errors }}
                    </span>
                {% endif %}

            </label>


            <!-- Açıklama -->
            <label class="form-control">

                <span class="mb-1.5 text-[10px] font-bold text-base-content/60">
                    Dekont no / açıklama
                </span>

                {{ form.notes }}

                {% if form.notes.errors %}
                    <span class="mt-1 text-[10px] text-error">
                        {{ form.notes.errors }}
                    </span>
                {% endif %}

            </label>


            <!-- Aksiyonlar -->
            <div class="modal-action mt-4 grid grid-cols-2 gap-2">

                <button
                    type="button"
                    class="btn btn-ghost h-10 min-h-0 rounded-xl text-xs font-bold"
                    onclick="closePaymentModal()">
                    İptal
                </button>

                <button
                    type="submit"
                    class="btn btn-primary h-10 min-h-0 rounded-xl text-xs font-bold shadow-sm">
                    Ödendi
                </button>

            </div>

        </form>

    </div>

</dialog>


<script>
    function closePaymentModal() {
        const modal = document.getElementById('payment_modal');

        if (modal) {
            modal.remove();
        }

        const container = document.getElementById('modal-container');

        if (container) {
            container.innerHTML = '';
        }
    }
</script>
