<!-- finance/templates/finance/modals/_mark_paid_modal.html -->
<dialog id="payment_modal" class="ui-modal" data-modal-backdrop-close="true">
    <div class="ui-modal-panel">
        <header class="ui-modal-header">
            <div class="ui-modal-heading">
                <p class="ui-modal-eyebrow">Ödeme tahsilatı</p>
                <h3 class="ui-modal-title">Ödemeyi tamamla</h3>
            </div>
            <button type="button" class="ui-modal-close" data-modal-close aria-label="Kapat">✕</button>
        </header>
        <form hx-post="{% url 'finance-mark-paid' payment.id %}"
              hx-target="#payment-row-{{ payment.id }}"
              hx-swap="outerHTML"
              class="ui-modal-form">
            {% csrf_token %}
            <div class="ui-payment-summary">
                <div class="px-4 py-3">
                    <p class="ui-text-muted text-[10px]">Sporcu</p>
                    <p class="mt-0.5 truncate text-sm font-bold">{{ payment.athlete.get_full_name|default:"Genel Gelir" }}</p>
                </div>
                <div class="flex items-center justify-between px-4 py-3">
                    <span class="ui-text-muted text-xs">Dönem</span>
                    <span class="text-xs font-bold">{{ payment.period }}</span>
                </div>
                <div class="flex items-center justify-between px-4 py-3">
                    <span class="ui-text-muted text-xs">Tahsil edilecek</span>
                    <strong class="ui-payment-total-value">{{ payable_amount|floatformat:0 }}</strong>
                </div>
            </div>
            <label class="ui-field">
                <span class="ui-label">Ödeme yöntemi</span>
                {{ form.payment_method }}
                {% if form.payment_method.errors %}
                    <span class="ui-error">{{ form.payment_method.errors|striptags }}</span>
                {% endif %}
            </label>
            <label class="ui-field">
                <span class="ui-label">Dekont no / açıklama</span>
                {{ form.notes }}
                {% if form.notes.errors %}
                    <span class="ui-error">{{ form.notes.errors|striptags }}</span>
                {% endif %}
            </label>
            <div class="ui-modal-actions">
                <button type="button" class="ui-btn ui-btn-secondary" data-modal-close>İptal</button>
                <button type="submit" class="ui-btn ui-btn-primary">Ödendi</button>
            </div>
        </form>
    </div>
</dialog>
