<!-- finance/templates/finance/modals/_mark_paid_modal.html -->
<dialog id="payment_modal" class="modal modal-open">
    <div class="modal-box">
        <h3 class="font-bold text-lg mb-2">💳 Ödeme Tahsilatı</h3>
        
        <div class="bg-base-200 p-3 rounded-lg mb-4 text-sm space-y-1">
            <p><strong>Sporcu:</strong> {{ payment.athlete.get_full_name|default:"Genel Gelir" }}</p>
            <p><strong>Dönem:</strong> {{ payment.period }}</p>
            <p><strong>Tutar:</strong> <span class="text-success font-bold">{{ payment.amount }} TL</span></p>
        </div>

        <form hx-post="{% url 'finance-mark-paid' payment.id %}"
              hx-target="#payment-row-{{ payment.id }}"
              hx-swap="outerHTML">
            {% csrf_token %}

            <div class="form-control w-full mb-3">
                <label class="label"><span class="label-text font-semibold">Ödeme Yöntemi</span></label>
                {{ form.payment_method }}
            </div>

            <div class="form-control w-full mb-4">
                <label class="label"><span class="label-text font-semibold">Dekont No / Açıklama</span></label>
                {{ form.notes }}
            </div>

            <div class="modal-action">
                <button type="button" class="btn btn-ghost" onclick="closePaymentModal()">İptal</button>
                <button type="submit" class="btn btn-success text-white">Ödendi Olarak İşaretle</button>
            </div>
        </form>
    </div>
</dialog>

<script>
    function closePaymentModal() {
        const modal = document.getElementById('payment_modal');
        if (modal) modal.remove();
        document.getElementById('modal-container').innerHTML = '';
    }
</script>
