<dialog id="regular_expense_modal" class="modal modal-open">
    <div class="modal-box max-w-2xl rounded-2xl p-0">
        <div class="flex items-start justify-between border-b border-base-200 px-6 py-5">
            <div>
                <p class="text-xs font-bold uppercase tracking-widest text-primary">Tekrarlayan gider planı</p>
                <h3 class="mt-1 text-2xl font-black">{{ modal_title }}</h3>
                <p class="mt-1 text-sm text-base-content/60">Ödeme sıklığı ve geçerlilik tarihlerini tanımlayın.</p>
            </div>
            <button type="button" class="btn btn-circle btn-ghost btn-sm" onclick="closeRegularExpenseModal()" aria-label="Kapat">✕</button>
        </div>

        <form {% if form_action == 'regular-expense-update' %}hx-post="{% url 'regular-expense-update' regular_expense_id %}"{% else %}hx-post="{% url 'regular-expense-create' %}"{% endif %}
              hx-target="#regular-expense-list"
              hx-swap="outerHTML"
              class="space-y-4 px-6 py-6">
            {% csrf_token %}
            <input type="hidden" name="category_filter" value="{{ category_filter }}">
            <input type="hidden" name="query_filter" value="{{ query_filter }}">
            <input type="hidden" name="status_filter" value="{{ status_filter }}">
            {% if form.non_field_errors %}<div class="alert alert-error text-sm">{{ form.non_field_errors }}</div>{% endif %}
            <div class="grid gap-4 sm:grid-cols-2">
                <label class="form-control sm:col-span-2">
                    <span class="label label-text font-bold">Harcama kategorisi</span>
                    {{ form.category }}
                    {% if form.category.errors %}<span class="label-text-alt text-error">{{ form.category.errors|striptags }}</span>{% endif %}
                </label>
                <label class="form-control">
                    <span class="label label-text font-bold">Tutar (TL)</span>
                    {{ form.amount }}
                    {% if form.amount.errors %}<span class="label-text-alt text-error">{{ form.amount.errors|striptags }}</span>{% endif %}
                </label>
                <label class="form-control">
                    <span class="label label-text font-bold">Alıcı / firma</span>
                    {{ form.reciever }}
                </label>
                <label class="form-control">
                    <span class="label label-text font-bold">Başlangıç tarihi</span>
                    {{ form.start_date }}
                </label>
                <label class="form-control">
                    <span class="label label-text font-bold">Bitiş tarihi</span>
                    {{ form.end_date }}
                    <span class="label-text-alt text-base-content/50">Boş bırakırsanız devam eder.</span>
                </label>
                <label class="form-control">
                    <span class="label label-text font-bold">Tekrarlama sıklığı</span>
                    {{ form.frequency }}
                </label>
                <label class="form-control">
                    <span class="label label-text font-bold">Ödeme günü</span>
                    {{ form.paymentDay }}
                </label>
                <label class="form-control sm:col-span-2">
                    <span class="label label-text font-bold">Açıklama</span>
                    {{ form.notes }}
                </label>
            </div>
            <div class="modal-action border-t border-base-200 pt-4">
                <button type="button" class="btn btn-ghost" onclick="closeRegularExpenseModal()">İptal</button>
                <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
            </div>
        </form>
    </div>
</dialog>

<script>
    function closeRegularExpenseModal() {
        const modal = document.getElementById('regular_expense_modal');
        if (modal) modal.remove();
        document.getElementById('regular-expense-modal-container').innerHTML = '';
    }
</script>
