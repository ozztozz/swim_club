{% if approved_athletes %}

<div class="divide-y divide-base-content/10">

    {% for athlete in approved_athletes %}

    <div
        class="flex items-center gap-3 px-3 py-3 transition-colors hover:bg-base-200/30 active:bg-base-200/50"
    >

        <!-- Sporcu bilgisi -->
        <a
            href="{% url 'athlete-manage-detail' athlete.pk %}"
            class="min-w-0 flex-1 block rounded-xl py-1 transition-colors active:bg-base-200/60"
            >
            <p class="truncate text-sm font-semibold text-base-content/80">
                {{ athlete.first_name }} {{ athlete.last_name }}
            </p>

            <div class="mt-0.5 flex items-center gap-1.5">
                {% if athlete.team %}
                    <span class="truncate text-[11px] font-medium text-base-content/45">
                        {{ athlete.team.name }}
                    </span>
                {% else %}
                    <span class="text-[11px] text-base-content/35">
                        Takım atanmadı
                    </span>
                {% endif %}
            </div>
        </a>

        <!-- İşlem -->
        <div class="shrink-0">
            <button
                hx-get="{% url 'athlete-manage-payment' athlete.id current_period %}?dashboard=1"
                hx-target="#modal-container"
                hx-swap="innerHTML"
                type="button"
                class="btn btn-primary h-8 min-h-0 rounded-lg px-3 text-[11px] font-semibold shadow-none"
            >
                Ödeme al
            </button>
        </div>

    </div>

    {% endfor %}

</div>

{% else %}

<div class="px-4 py-10 text-center">
    <div class="mx-auto flex h-10 w-10 items-center justify-center rounded-full bg-base-200/70 text-base-content/35">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.7"
        >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m21 21-4.35-4.35m1.35-5.15a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"
            />
        </svg>
    </div>

    <p class="mt-2 text-xs font-medium text-base-content/45">
        Ödeme almak için sporcu adı veya veli adı arayın.
    </p>
</div>

{% endif %}
