{% extends "base.html" %}

{% block content %}
<div class="space-y-8">
    <h1 class="text-3xl font-bold">Yönetici Paneli</h1>

    <!-- 1. Onay Bekleyen Sporcular Kartı -->
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title text-warning">
                ⏳ Onay Bekleyen Sporcu Kayıtları
            </h2>
            <div id="pending-athletes-list" class="mt-4">
                {% include "dashboard/_pending_athletes.html" %}
            </div>
        </div>
    </div>

    <!-- 2. Onaylı Sporcular & Canlı Arama Kartı -->
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <h2 class="card-title text-success">
                    🏊‍♂️ Onaylı Sporcu Listesi
                </h2>
                <!-- HTMX Canlı Arama Kutusu -->
                <div class="form-control w-full md:w-72">
                    <input 
                        type="text" 
                        name="q" 
                        placeholder="Sporcu veya veli ara..." 
                        class="input input-bordered w-full input-sm"
                        hx-get="{% url 'dashboard-search-athletes' %}" 
                        hx-trigger="keyup changed delay:500ms" 
                        hx-target="#approved-athletes-list" 
                        hx-swap="innerHTML"
                    />
                </div>
            </div>

            <!-- HTMX Hedef Alanı -->
            <div id="approved-athletes-list" class="mt-4">
                {% include "dashboard/_approved_athletes.html" %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
