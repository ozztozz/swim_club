{% extends "base.html" %}

{% block content %}

<div class="w-full space-y-5">

    <header class="rounded-2xl border border-base-300 bg-base-100 p-4 shadow-sm">
        <div class="flex items-start justify-between gap-3">
            <div>
                <p class="text-[10px] font-black uppercase tracking-[0.16em] text-primary/70">
                    Yönetim merkezi
                </p>
                <h1 class="mt-1 text-xl font-black tracking-tight text-base-content">
                    Diğer
                </h1>
                <p class="mt-1 text-xs leading-relaxed text-base-content/50">
                    Kulübün günlük yönetim araçlarına hızlı erişim.
                </p>
            </div>

            <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-primary/10 text-primary">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3v18"/>
                    <path d="M3 12h18"/>
                    <path d="M5 5h14v14H5z"/>
                </svg>
            </span>
        </div>
    </header>

    <section class="space-y-2">
        <div class="flex items-center justify-between px-1">
            <h2 class="text-sm font-black text-base-content">Kısa yollar</h2>
            <span class="text-[10px] font-semibold text-base-content/40">5 araç</span>
        </div>

        <div class="grid grid-cols-2 gap-2.5">

        <a href="{% url 'team-list' %}" class="group flex min-h-[126px] flex-col justify-between rounded-2xl border border-base-300 bg-base-100 p-4 shadow-sm transition hover:border-primary/30 active:scale-[.98]">
            <span class="grid h-10 w-10 place-items-center rounded-xl bg-primary/10 text-primary">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            </span>
            <span class="text-sm font-bold">Takımlar</span>
        </a>

        <a href="{% url 'athlete-manage-list' %}" class="group flex min-h-[126px] flex-col justify-between rounded-2xl border border-base-300 bg-base-100 p-4 shadow-sm transition hover:border-success/30 active:scale-[.98]">
            <span class="grid h-10 w-10 place-items-center rounded-xl bg-success/10 text-success">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/>
                </svg>
            </span>
            <span class="text-sm font-bold">Sporcular</span>
        </a>

        <a href="{% url 'equipment-list' %}" class="group flex min-h-[126px] flex-col justify-between rounded-2xl border border-base-300 bg-base-100 p-4 shadow-sm transition hover:border-warning/30 active:scale-[.98]">
            <span class="grid h-10 w-10 place-items-center rounded-xl bg-warning/10 text-warning">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m14.5 4.5 5 5"/>
                    <path d="M3 21l6.5-6.5"/>
                    <path d="m13 6 5 5"/>
                    <path d="m5 19 7-7"/>
                </svg>
            </span>
            <span class="text-sm font-bold">Malzemeler</span>
        </a>

        <a href="{% url 'equipment-stock' %}" class="group flex min-h-[126px] flex-col justify-between rounded-2xl border border-base-300 bg-base-100 p-4 shadow-sm transition hover:border-info/30 active:scale-[.98]">
            <span class="grid h-10 w-10 place-items-center rounded-xl bg-info/10 text-info">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 7h16v13H4z"/>
                    <path d="M8 7V4h8v3"/>
                    <path d="M8 12h8"/>
                </svg>
            </span>
            <span class="text-sm font-bold">Malzeme stoku</span>
        </a>

        <a href="{% url 'regular-expense-list' %}" class="group flex min-h-[126px] flex-col justify-between rounded-2xl border border-base-300 bg-base-100 p-4 shadow-sm transition hover:border-error/30 active:scale-[.98]">
            <span class="grid h-10 w-10 place-items-center rounded-xl bg-error/10 text-error">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 3-6.7"/>
                    <path d="M3 4v8h8"/>
                    <path d="M12 7v5l3 2"/>
                </svg>
            </span>
            <span class="text-sm font-bold">Düzenli giderler</span>
        </a>

        <a href="{% url 'fee-management' %}" class="group col-span-2 flex min-h-[104px] flex-row items-center justify-between gap-3 rounded-2xl border border-base-300 bg-base-100 p-4 shadow-sm transition hover:border-info/30 active:scale-[.98]">
            <span class="grid h-10 w-10 place-items-center rounded-xl bg-info/10 text-info">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="18" height="14" rx="2"/>
                    <path d="M3 10h18"/>
                    <path d="M7 15h3"/>
                </svg>
            </span>
            <span class="text-sm font-bold">Aidat yönetimi</span>
        </a>

        </div>

    </section>

</div>

{% endblock %}
