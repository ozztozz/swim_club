<dialog id="edit_athlete_modal" class="modal modal-open">
    <div class="modal-box">
        <h3 class="font-bold text-lg mb-4">
            🏊‍♂️ {{ athlete.first_name }} {{ athlete.last_name }} - Takım & Aidat Düzenle
        </h3>

        <form hx-post="{% url 'dashboard-edit-athlete-team' athlete.id %}" 
              hx-target="#approved-athletes-list" 
              hx-swap="innerHTML">
            {% csrf_token %}

            <div class="form-control w-full mb-3">
                <label class="label"><span class="label-text font-semibold">{{ form.team.label }}</span></label>
                {{ form.team }}
            </div>

            <div class="form-control w-full mb-4">
                <label class="label"><span class="label-text font-semibold">{{ form.custom_fee.label }}</span></label>
                {{ form.custom_fee }}
                <label class="label pt-1">
                    <span class="label-text-alt text-base-content/60">Burslu/Ücretsiz sporcular için 0 yazabilirsiniz.</span>
                </label>
            </div>

            <div class="modal-action">
                <button type="button" class="btn btn-ghost" onclick="closeAthleteModal()">İptal</button>
                <button type="submit" class="btn btn-primary">Kaydet</button>
            </div>
        </form>
    </div>
</dialog>

<script>
    function closeAthleteModal() {
        const modal = document.getElementById('edit_athlete_modal');
        if (modal) modal.remove();
        document.getElementById('modal-container').innerHTML = '';
    }
</script>
