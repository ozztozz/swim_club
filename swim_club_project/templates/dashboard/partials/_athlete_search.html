 
<dialog
    id="expense_modal"
    class="ui-modal"
    data-modal-backdrop-close="true"
>

    <div class="ui-modal-panel">

        <!-- =====================================================
             HEADER
             ===================================================== -->


        <!-- =====================================================
             FORM
             ===================================================== -->

       <section class="ui-list">

        <!-- Arama -->
        <form
            method="get"
            hx-get="{% url 'dashboard-search-athletes' %}"
            hx-target="#collection-list"
            hx-swap="innerHTML"
            hx-trigger="submit, keyup changed delay:350ms from:input[name='q']"
            class="ui-list-search"
        >

            <label
                for="dashboard-athlete-search"
                class="ui-search-field"
            >

                <span class="sr-only">
                    Sporcu veya veli ara
                </span>

                <span
                    class="ui-search-icon"
                    aria-hidden="true"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle
                            cx="11"
                            cy="11"
                            r="7"
                        />

                        <path
                            d="m20 20-3.5-3.5"
                        />
                    </svg>
                </span>

                <input
                    id="dashboard-athlete-search"
                    type="search"
                    name="q"
                    minlength="3"
                    placeholder="Sporcu veya veli ara"
                    autocomplete="off"
                    class="ui-input ui-search-input"
                    autofocus
                >

            </label>

        </form>


        <!-- Sporcu listesi -->
        <div
            id="collection-list"
            class="ui-scroll-list"
        >

            {% include "dashboard/_approved_athletes.html" %}

        </div>

    </section>



    </div>

</dialog>
