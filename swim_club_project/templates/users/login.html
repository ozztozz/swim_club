{% extends "base.html" %}
{% block content %}
<div class="min-h-[80dvh] flex flex-col items-center justify-center px-4 py-8">
    
    <!-- BRAND / LOGO ALANI -->
    <div class="text-center mb-6 animate-fade-in">
        <span class="text-xs uppercase tracking-widest font-bold text-[var(--ui-muted)]">Spor Kulübü</span>
        <h1 class="text-3xl font-extrabold tracking-tight text-[var(--ui-text)] mt-1">
            ALPHA ACADEMY
        </h1>
        <p class="text-xs text-[var(--ui-subtle)] mt-2">Hesabınıza giriş yaparak devam edin.</p>
    </div>

    <!-- DJANGO HATA/BİLGİ MESAJLARI (Yeni Durum Renkleriyle Uyumlu Rozetler) -->
    {% if messages %}
        <div class="w-full max-w-[380px] mb-4 flex flex-col gap-2">
            {% for message in messages %}
                <div class="ui-badge {% if message.tags == 'error' %}ui-badge-danger{% else %}ui-badge-primary{% endif %} w-full py-2.5 px-4 rounded-xl text-xs font-medium justify-start shadow-sm">
                    🔔 {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- GİRİŞ FORMU (YENİ CAM EFEKTİ / GLASSMORPHISM PANEL) -->
    <div class="w-full max-w-[380px] profile-hero-card p-6 sm:p-8 backdrop-blur-xl">
        <form method="post" class="ui-modal-form">
            {% csrf_token %}
            
            <!-- Kullanıcı Adı Alanı -->
            <div class="ui-field text-left">
                <label class="ui-label" for="id_username">Kullanıcı adı</label>
                <div class="relative">
                    <input type="text" 
                           name="username" 
                           id="id_username" 
                           required 
                           placeholder="Kullanıcı adınızı girin"
                           class="ui-input placeholder:opacity-50">
                </div>
            </div>

            <!-- Şifre Alanı -->
            <div class="ui-field text-left mt-2">
                <label class="ui-label" for="id_password">Şifre</label>
                <div class="relative">
                    <input type="password" 
                           name="password" 
                           id="id_password" 
                           required 
                           placeholder="••••••••"
                           class="ui-input placeholder:opacity-50">
                </div>
            </div>

            <!-- Giriş Butonu (Projenizin ui-btn-dark Tarzına Uyarlandı) -->
            <div class="mt-4">
                <button type="submit" class="ui-btn ui-btn-dark w-full justify-center text-sm font-semibold shadow-md">
                    Giriş Yap
                </button>
            </div>
        </form>
    </div>

    <!-- ALT BİLGİ NOTU -->
    <div class="mt-6 text-center text-xs text-[var(--ui-muted)]">
        Yetkili kullanıcı hesabınızla giriş yapın.
    </div>

</div>
{% endblock %}
