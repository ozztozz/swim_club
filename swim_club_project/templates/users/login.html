{% extends "base.html" %}

{% block content %}

<div class="flex min-h-[calc(100dvh-8rem)] items-center justify-center px-4">


<div class="w-full max-w-sm">

    <!-- Logo / Başlık -->
    <div class="mb-7 text-center">

        <img
            src="/media/logos/fk1.png"
            alt="Spor Kulübü"
            class="mx-auto h-20 w-20 rounded-full border border-base-300/80 bg-base-100 p-1 shadow-none"
        >

        <h1 class="mt-4 text-lg font-black tracking-tight text-base-content">
            ALPHA ACADEMY
        </h1>

        <p class="mt-1 text-[11px] text-base-content/45">
            Hesabınıza giriş yaparak devam edin.
        </p>

    </div>


    <!-- Giriş Alanı -->
    <section class="rounded-2xl border border-base-300/80 bg-base-100 p-4 sm:p-5">

        <!-- Hatalar -->
        {% if messages %}

            <div class="mb-4 space-y-2">

                {% for message in messages %}

                    <div class="flex items-start gap-2 rounded-xl border border-error/20 bg-error/5 px-3 py-2.5 text-[11px] text-error">

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="mt-0.5 h-3.5 w-3.5 shrink-0"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M12 9v3.75m0 3h.008M10.29 3.86l-7.1 12.28A1.5 1.5 0 0 0 4.49 18.4h15.02a1.5 1.5 0 0 0 1.3-2.26l-7.1-12.28a1.5 1.5 0 0 0-2.6 0Z"
                            />
                        </svg>

                        <span class="leading-4">
                            {{ message }}
                        </span>

                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <!-- Form -->
        <form
            method="post"
            action="{% url 'user-login' %}"
            class="space-y-3"
        >

            {% csrf_token %}


            <!-- Kullanıcı adı -->
            <label class="block">

                <span class="mb-1.5 block text-[10px] font-semibold text-base-content/55">
                    Kullanıcı adı
                </span>

                <input
                    type="text"
                    name="username"
                    required
                    autocomplete="username"
                    placeholder="Kullanıcı adınızı girin"
                    class="input input-bordered h-10 min-h-0 w-full rounded-xl border-base-300/80 bg-base-100 px-3 text-xs outline-none focus:border-primary/50 focus:outline-none focus:ring-2 focus:ring-primary/10"
                >

            </label>


            <!-- Şifre -->
            <label class="block">

                <span class="mb-1.5 block text-[10px] font-semibold text-base-content/55">
                    Şifre
                </span>

                <input
                    type="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    placeholder="Şifrenizi girin"
                    class="input input-bordered h-10 min-h-0 w-full rounded-xl border-base-300/80 bg-base-100 px-3 text-xs outline-none focus:border-primary/50 focus:outline-none focus:ring-2 focus:ring-primary/10"
                >

            </label>


            <!-- Giriş -->
            <button
                type="submit"
                class="btn btn-primary mt-2 h-10 min-h-0 w-full rounded-xl text-xs font-bold shadow-none"
            >
                Giriş Yap
            </button>

        </form>

    </section>


    <p class="mt-4 text-center text-[9px] text-base-content/30">
        Yetkili kullanıcı hesabınızla giriş yapın.
    </p>

</div>


</div>

{% endblock %}
