{% load static %}

<header class="app-topbar">
    <div class="app-topbar-inner">

        <!-- Marka -->
        <a
            href="/"
            class="app-brand"
            aria-label="ALPHA ACADEMY ana sayfa"
        >
            <div class="app-brand-mark">
                <img
                    src="/media/logos/fk1.png"
                    alt="ALPHA ACADEMY"
                    class="app-brand-logo"
                >
            </div>

            <div class="app-brand-copy">
                <span class="app-brand-name">
                    ALPHA ACADEMY
                </span>

                <span class="app-brand-label">
                    Kulüp Yönetimi
                </span>
            </div>
        </a>


        <!-- Sağ taraf -->
        <div class="app-topbar-actions">

            <!-- Bildirimler -->
            <button
                type="button"
                class="app-icon-button"
                aria-label="Bildirimler"
            >
                <span
                    class="app-icon"
                    aria-hidden="true"
                >
                    ♧
                </span>
            </button>


            <!-- Profil -->
            <button
                type="button"
                class="app-avatar-button"
                aria-label="Profil"
            >
                <span class="app-avatar-small">
                    A
                </span>
            </button>

        </div>

    </div>
</header>
