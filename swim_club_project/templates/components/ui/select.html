{% comment %}
Kullanım:

{% include "components/ui/select.html" with
    name="category"
    label="Kategori"
    options=categories
%}
{% endcomment %}

<div class="ui-field {% if field_class %}{{ field_class }}{% endif %}">

    {% if label %}
        <label
            for="{{ select_id|default:name }}"
            class="ui-label"
        >
            {{ label }}

            {% if required %}
                <span class="ui-required">*</span>
            {% endif %}
        </label>
    {% endif %}

    <select
        id="{{ select_id|default:name }}"
        name="{{ name }}"
        class="ui-select {% if select_class %}{{ select_class }}{% endif %}"
        {% if required %}required{% endif %}
        {% if disabled %}disabled{% endif %}
    >

        {% if placeholder %}
            <option value="">
                {{ placeholder }}
            </option>
        {% endif %}

        {% for option in options %}
            <option
                value="{{ option.value }}"
                {% if option.value|stringformat:"s" == selected|stringformat:"s" %}
                    selected
                {% endif %}
            >
                {{ option.label }}
            </option>
        {% endfor %}

        {% block options %}{% endblock %}

    </select>

    {% if help_text %}
        <p class="ui-help">
            {{ help_text }}
        </p>
    {% endif %}

    {% if error %}
        <p class="ui-error">
            {{ error }}
        </p>
    {% endif %}

</div>
