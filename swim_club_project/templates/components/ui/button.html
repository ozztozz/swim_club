{% comment %}
Kullanım:

{% include "components/ui/button.html" with
    text="Kaydet"
    type="submit"
    variant="primary"
%}

Desteklenen:
- primary
- dark
- secondary
- ghost
- danger
{% endcomment %}

{% if href %}
    <a
        href="{{ href }}"
        class="ui-btn
            {% if variant == 'primary' %}ui-btn-primary
            {% elif variant == 'dark' %}ui-btn-dark
            {% elif variant == 'secondary' %}ui-btn-secondary
            {% elif variant == 'danger' %}ui-btn-danger
            {% else %}ui-btn-ghost{% endif %}
            {% if size == 'sm' %}ui-btn-sm{% endif %}
            {% if block %}w-full{% endif %}
        "
        {% if aria_label %}aria-label="{{ aria_label }}"{% endif %}
    >
        {% if icon %}
            <span class="ui-btn-icon" aria-hidden="true">
                {{ icon }}
            </span>
        {% endif %}

        <span>{{ text }}</span>
    </a>
{% else %}
    <button
        type="{{ type|default:'button' }}"
        class="ui-btn
            {% if variant == 'primary' %}ui-btn-primary
            {% elif variant == 'dark' %}ui-btn-dark
            {% elif variant == 'secondary' %}ui-btn-secondary
            {% elif variant == 'danger' %}ui-btn-danger
            {% else %}ui-btn-ghost{% endif %}
            {% if size == 'sm' %}ui-btn-sm{% endif %}
            {% if block %}w-full{% endif %}
        "
        {% if aria_label %}aria-label="{{ aria_label }}"{% endif %}
    >
        {% if icon %}
            <span class="ui-btn-icon" aria-hidden="true">
                {{ icon }}
            </span>
        {% endif %}

        <span>{{ text }}</span>
    </button>
{% endif %}
