<dialog id="athlete_payment_modal" class="modal modal-open">
    <div class="modal-box w-[calc(100%-1rem)] max-w-md p-5 sm:w-11/12 sm:p-6">
        <p class="text-xs font-bold uppercase tracking-widest text-primary">Ödeme işlemi</p>
        <h3 class="mt-1 text-2xl font-black">{{ item.label }}</h3>
        <div class="mt-5 rounded-xl bg-base-200/70 p-4">
            <p class="text-sm text-base-content/60">Sporcu</p>
            <p class="font-bold">{{ athlete.get_full_name }}</p>
            <div class="mt-3 flex items-center justify-between border-t border-base-300 pt-3">
                <span class="text-sm text-base-content/60">Ödenecek tutar</span>
                <strong class="text-xl">{% if item.payment %}{{ item.payment.amount|floatformat:2 }}{% else %}{{ item.amount|floatformat:2 }}{% endif %} TL</strong>
            </div>
            <div class="mt-3 flex items-center justify-between border-t border-base-300 pt-3">
                <span class="text-sm text-base-content/60">Ödeme yöntemi</span>
                <span class="font-bold">Nakit</span>
            </div>
        </div>
        <form method="post" hx-post="{% url 'athlete-manage-payment' athlete.pk item.period %}" hx-target="#payment-{{ item.period }}" hx-swap="outerHTML">
            {% csrf_token %}
            <div class="modal-action flex-col-reverse sm:flex-row">
                <button type="button" class="btn btn-ghost w-full sm:w-auto" onclick="document.getElementById('athlete_payment_modal').remove()">Vazgeç</button>
                <button type="submit" class="btn btn-primary w-full sm:w-auto">Ödendi</button>
            </div>
        </form>
    </div>
</dialog>
