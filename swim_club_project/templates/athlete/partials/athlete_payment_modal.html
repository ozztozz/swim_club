<dialog id="athlete_payment_modal" class="modal modal-open">

    <div class="modal-box w-[calc(100%-1rem)] max-w-md rounded-2xl p-4 sm:p-5">

        <!-- Başlık -->
        <div>
            <p class="text-[10px] font-black uppercase tracking-widest text-primary">
                Ödeme işlemi
            </p>

            <h3 class="mt-1 text-xl font-black text-base-content">
                {{ item.label }}
            </h3>
        </div>


        <!-- Ödeme Özeti -->
        <div class="mt-4 overflow-hidden rounded-2xl border border-base-200 bg-base-200/50">

            <!-- Sporcu -->
            <div class="px-4 py-3">
                <p class="text-[10px] font-medium text-base-content/40">
                    Sporcu
                </p>

                <p class="mt-0.5 truncate text-sm font-bold">
                    {{ athlete.get_full_name }}
                </p>
            </div>


            <!-- Tutar -->
            <div class="flex items-center justify-between border-t border-base-300 px-4 py-3">

                <span class="text-xs text-base-content/50">
                    Ödenecek tutar
                </span>

                <strong class="text-lg font-black text-primary">
                    {% if item.payment %}
                        {{ item.payment.amount|floatformat:0 }}
                    {% else %}
                        {{ item.amount|floatformat:0 }}
                    {% endif %}
                </strong>

            </div>


            <!-- Ödeme yöntemi -->
            <div class="flex items-center justify-between border-t border-base-300 px-4 py-3">

                <span class="text-xs text-base-content/50">
                    Ödeme yöntemi
                </span>

                <span class="text-xs font-bold">
                    Nakit
                </span>

            </div>

        </div>


        <!-- Form -->
        <form
            method="post"
            hx-post="{% url 'athlete-manage-payment' athlete.pk item.period %}"
            hx-target="#payment-{{ item.payment.pk|default:item.period }}"
            hx-swap="outerHTML">

            {% csrf_token %}

            <div class="modal-action mt-4 grid grid-cols-2 gap-2">

                <button
                    type="button"
                    class="btn btn-ghost h-10 min-h-0 rounded-xl text-xs font-bold"
                    onclick="document.getElementById('athlete_payment_modal').remove()">
                    Vazgeç
                </button>

                <button
                    type="submit"
                    class="btn btn-primary h-10 min-h-0 rounded-xl text-xs font-bold shadow-sm">
                    Ödendi
                </button>

            </div>

        </form>

    </div>

</dialog>
