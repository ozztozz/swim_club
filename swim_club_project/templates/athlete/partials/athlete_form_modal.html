<dialog id="athlete_modal" class="modal modal-open">
    <div class="modal-box max-h-[90vh] w-[calc(100%-1rem)] max-w-4xl overflow-hidden p-0 sm:w-11/12">
        <div class="border-b border-base-200 px-5 py-4 sm:px-6">
            <h3 class="text-xl font-black sm:text-2xl">{{ modal_title }}</h3>
        </div>
        <form method="post" enctype="multipart/form-data" hx-post="{% if athlete %}{% url 'athlete-manage-update' athlete.pk %}{% if return_to_detail %}?return_to_detail=1{% endif %}{% else %}{% url 'athlete-manage-create' %}{% endif %}" hx-target="#athlete-table" hx-swap="outerHTML" class="max-h-[calc(90vh-5rem)] space-y-4 overflow-y-auto px-5 py-5 sm:px-6">
            {% csrf_token %}
            {% if return_to_detail %}<input type="hidden" name="return_to_detail" value="1">{% endif %}
            {% if form.non_field_errors %}<div class="alert alert-error">{{ form.non_field_errors }}</div>{% endif %}
            <div class="grid min-w-0 gap-4 sm:grid-cols-2">
                <label class="form-control"><span class="label label-text font-bold">Ad</span>{{ form.first_name }}{{ form.first_name.errors }}</label>
                <label class="form-control"><span class="label label-text font-bold">Soyad</span>{{ form.last_name }}{{ form.last_name.errors }}</label>
                <label class="form-control"><span class="label label-text font-bold">Sporcu telefonu</span>{{ form.phone_number }}{{ form.phone_number.errors }}</label>
                <label class="form-control"><span class="label label-text font-bold">Veli</span>{{ form.parent }}{{ form.parent.errors }}</label>
                <label class="form-control"><span class="label label-text font-bold">Veli telefonu</span>{{ form.parent_phone }}{{ form.parent_phone.errors }}</label>
                <label class="form-control"><span class="label label-text font-bold">Veli e-postası</span>{{ form.parent_email }}{{ form.parent_email.errors }}</label>
                <label class="form-control"><span class="label label-text font-bold">Cinsiyet</span>{{ form.gender }}{{ form.gender.errors }}</label>
                <label class="form-control"><span class="label label-text font-bold">Doğum tarihi</span>{{ form.birth_date }}{{ form.birth_date.errors }}</label>
                <label class="form-control"><span class="label label-text font-bold">Kulübe katılım tarihi</span>{{ form.joined_date }}{{ form.joined_date.errors }}</label>
                <label class="form-control"><span class="label label-text font-bold">T.C. kimlik no</span>{{ form.tc_identity }}</label>
                <label class="form-control"><span class="label label-text font-bold">Okul</span>{{ form.school }}</label>
                <label class="form-control"><span class="label label-text font-bold">Lisans no</span>{{ form.license_number }}</label>
                <label class="form-control"><span class="label label-text font-bold">Fotoğraf</span>{{ form.photo }}</label>
                <label class="form-control"><span class="label label-text font-bold">Takım</span>{{ form.team }}</label>
                <label class="form-control"><span class="label label-text font-bold">Durum</span>{{ form.status }}</label>
                <label class="form-control"><span class="label label-text font-bold">Özel aidat (TL)</span>{{ form.custom_fee }}</label>
                <label class="form-control"><span class="label label-text font-bold">İndirim (%)</span>{{ form.discount_percentage }}</label>
                <label class="form-control"><span class="label label-text font-bold">Ödeme günü</span>{{ form.regular_payment_day }}</label>
            </div>
            <label class="label cursor-pointer justify-start gap-3"><span class="label-text font-bold">Aktif sporcu</span>{{ form.is_active }}</label>
            <div class="modal-action flex-col-reverse border-t border-base-200 pt-4 sm:flex-row"><button type="button" class="btn btn-ghost w-full sm:w-auto" onclick="document.getElementById('athlete_modal').remove()">İptal</button><button class="btn btn-primary w-full sm:w-auto" type="submit">{{ submit_label }}</button></div>
        </form>
    </div>
</dialog>
