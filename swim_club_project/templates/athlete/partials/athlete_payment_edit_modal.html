<dialog id="athlete_payment_edit_modal" class="modal modal-open">
    <div class="modal-box w-[calc(100%-1rem)] max-w-lg p-5 sm:w-11/12 sm:p-6">
        <p class="text-xs font-bold uppercase tracking-widest text-primary">Ödeme düzenleme</p>
        <h3 class="mt-1 text-2xl font-black">{{ payment_label }}</h3>
        <form method="post" hx-post="{% url 'athlete-manage-payment-edit' athlete.pk period %}" hx-target="#payment-{{ period }}" hx-swap="outerHTML" class="mt-5 space-y-4">
            {% csrf_token %}
            {% if form.non_field_errors %}<div class="alert alert-error">{{ form.non_field_errors }}</div>{% endif %}
            <label class="form-control"><span class="label label-text font-bold">Tutar</span>{{ form.amount }}{{ form.amount.errors }}</label>
            <div class="grid gap-4 sm:grid-cols-2">
                <label class="form-control"><span class="label label-text font-bold">Ödeme yöntemi</span>{{ form.payment_method }}{{ form.payment_method.errors }}</label>
                <label class="form-control"><span class="label label-text font-bold">Durum</span>{{ form.status }}{{ form.status.errors }}</label>
            </div>
            <label class="form-control"><span class="label label-text font-bold">Not</span>{{ form.notes }}{{ form.notes.errors }}</label>
            <div class="modal-action flex-col-reverse sm:flex-row">
                <button type="button" class="btn btn-ghost w-full sm:w-auto" onclick="document.getElementById('athlete_payment_edit_modal').remove()">Vazgeç</button>
                <button type="submit" class="btn btn-primary w-full sm:w-auto">{% if payment %}Kaydet{% else %}Ödendi{% endif %}</button>
            </div>
        </form>
    </div>
</dialog>
