<dialog id="athlete_status_modal" class="modal modal-open">
    <div class="modal-box w-[calc(100%-1rem)] max-w-md p-5 sm:w-11/12 sm:p-6">
        <h3 class="text-xl font-black">Sporcu durumunu değiştir</h3>
        <p class="py-4">
            <strong>{{ athlete.get_full_name }}</strong> sporcusunu
            {% if athlete.is_active %}<strong>pasif</strong>{% else %}<strong>aktif</strong>{% endif %}
            yapmak istediğinize emin misiniz?
        </p>
        <form method="post" hx-post="{% url 'athlete-manage-toggle-active' athlete.pk %}" hx-target="#athlete-status" hx-swap="outerHTML">
            {% csrf_token %}
            <div class="modal-action flex-col-reverse sm:flex-row">
                <button type="button" class="btn btn-ghost w-full sm:w-auto" onclick="document.getElementById('athlete_status_modal').remove()">Vazgeç</button>
                <button type="submit" class="btn w-full sm:w-auto {% if athlete.is_active %}btn-warning{% else %}btn-success{% endif %}">
                    {% if athlete.is_active %}Pasif yap{% else %}Aktif yap{% endif %}
                </button>
            </div>
        </form>
    </div>
</dialog>
