<dialog id="athlete_modal" class="modal modal-open">
    <div class="modal-box w-[calc(100%-1rem)] max-w-md p-5 sm:w-11/12 sm:p-6">
        <h3 class="text-xl font-black">Sporcuyu sil?</h3>
        <p class="py-4"><strong>{{ athlete.get_full_name }}</strong> kaydı ve ilişkili ödeme kayıtları silinebilir. Bu işlem geri alınamaz.</p>
        <form method="post" hx-post="{% url 'athlete-manage-delete' athlete.pk %}" hx-target="#athlete-table" hx-swap="outerHTML">
            {% csrf_token %}<div class="modal-action flex-col-reverse sm:flex-row"><button type="button" class="btn btn-ghost w-full sm:w-auto" onclick="document.getElementById('athlete_modal').remove()">İptal</button><button class="btn btn-error w-full sm:w-auto" type="submit">Sil</button></div>
        </form>
    </div>
</dialog>
