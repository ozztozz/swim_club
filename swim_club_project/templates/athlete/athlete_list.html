{% extends "base.html" %}
{% block content %}
    <div class="dashboard">
        <div class="page-header">
            <div class="page-header-main">
                <p class="page-eyebrow">{% if request.user.is_coach %}Antrenör{% else %}Kulüp yönetimi{% endif %}</p>
                <h1 class="page-title">Sporcular</h1>
            </div>
        </div>

        <section class="ui-section">
            <form hx-get="{% url 'athlete-manage-list' %}"
                  hx-trigger="input changed delay:300ms from:find input, change from:find select, search from:find input"
                  hx-target="#athlete-table"
                  hx-swap="outerHTML"
                  class="ui-modal-form">
                <label class="ui-search-field">
                    <span class="ui-search-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7" />
                            <path d="m20 20-3.5-3.5" />
                        </svg>
                    </span>
                    <input type="search"
                           name="q"
                           value="{{ query }}"
                           placeholder="Sporcu ara (en az 3 harf)"
                           class="ui-input ui-search-input"
                           autocomplete="off">
                </label>
                <select name="team" class="ui-select" aria-label="Takım filtresi">
                    <option value="">Tüm takımlar</option>
                    {% for team in teams %}
                        <option value="{{ team.pk }}" {% if selected_team == team.pk|stringformat:"s" %}selected{% endif %}>{{ team.name }}</option>
                    {% endfor %}
                </select>
            </form>
            {% include "athlete/partials/athlete_table.html" %}
        </section>
    </div>
{% endblock %}
