{% extends "base.html" %}

{% block content %}
<div class="mx-auto w-full max-w-7xl space-y-4 sm:space-y-6">
    <header class="flex items-center justify-between gap-3">
        <div>
            <h1 class="text-2xl font-black tracking-tight">Sporcular</h1>
            <p class="mt-1 hidden text-sm text-base-content/60 sm:block">Sporcu kayıtlarını, takım atamalarını ve aidat bilgilerini yönetin.</p>
        </div>
        <button class="btn btn-primary btn-sm shrink-0 sm:btn-md" hx-get="{% url 'athlete-manage-create' %}" hx-target="#athlete-modal-container" hx-swap="innerHTML">
            <span class="text-lg leading-none">+</span><span class="hidden sm:inline">Yeni sporcu</span><span class="sm:hidden">Ekle</span>
        </button>
    </header>

    <section class="overflow-hidden rounded-xl border border-base-200 bg-base-100 shadow-sm">
                <form method="get" class="relative flex gap-2 border-b border-base-200 bg-base-100 p-3 sm:p-4"
              hx-get="{% url 'athlete-manage-list' %}"
              hx-target="#athlete-table"
              hx-swap="outerHTML"
              hx-push-url="true"
                            hx-trigger="submit, keyup changed delay:350ms from:input[name='q']"
                            hx-on:htmx:before-request="if (this.querySelector('[name=q]').value.trim().length < 3) event.preventDefault()">
                        <label class="form-control min-w-0 flex-1"><span class="sr-only">Sporcu ara</span><input type="search" name="q" value="{{ query }}" minlength="3" placeholder="Sporcu yada veli adı ile ara" autocomplete="off" class="input input-bordered input-sm w-full"></label>
        </form>
        {% include 'athlete/partials/athlete_table.html' %}
    </section>
</div>
<div id="athlete-modal-container"></div>
<script>
    document.body.addEventListener('closeAthleteModal', function () {
        const modal = document.getElementById('athlete_modal');
        if (modal) modal.remove();
        document.getElementById('athlete-modal-container').innerHTML = '';
    });
</script>
{% endblock %}
