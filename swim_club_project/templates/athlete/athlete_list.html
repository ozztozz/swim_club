{% extends "base.html" %}
{% block content %}
    <div class="dashboard">
        <!-- SAYFA BAŞLIĞI -->
        <header>
            <div>
                <div>
                    <p class="text-primary-custom">Kulüp yönetimi</p>
                    <h1>Takımlar</h1>
                    <p>Takımları, antrenörleri ve aylık aidatlarını yönetin.</p>
                </div>
            </div>
            <!-- AKSİYONLAR -->
            <div>
                <a href="{% url 'fee-management' %}"
                   class="ui-btn ui-btn-sm ui-btn-secondary">
                    Ücret Yönetimi
                </a>
                <button type="button"
                        class="ui-btn ui-btn-sm ui-btn-primary"
                        hx-get="{% url 'team-create' %}"
                        hx-target="#modal-container"
                        hx-swap="innerHTML">
                    <span>+</span>
                    Yeni Takım
                </button>
            </div>
        </header>
        <!-- FİLTRE + TAKIMLAR -->
        <section class="ui-section">
            <!-- FİLTRE -->
            <form method="get">
                <div>
                    <!-- Takım ara -->
                    <label class="ui-field">
                        <span>Takım ara</span>
                        <input type="search"
                               name="q"
                               value="{{ query }}"
                               placeholder="Takım adı"
                               class="ui-input">
                    </label>
                    <!-- Durum -->
                    <label class="ui-field">
                        <span>Durum</span>
                        <select name="status"
                                class="ui-select">
                            <option value="active" {% if status == 'active' %}selected{% endif %}>Aktif</option>
                            <option value="all" {% if status == 'all' %}selected{% endif %}>Tümü</option>
                            <option value="inactive" {% if status == 'inactive' %}selected{% endif %}>Pasif</option>
                        </select>
                    </label>
                </div>
                <button type="submit"
                        class="ui-btn ui-btn-sm ui-btn-neutral">
                    Filtrele
                </button>
            </form>
            <!-- TAKIM LİSTESİ -->
            <div>{% include "team/partials/team_table.html" %}</div>
        </section>
    </div>
    <!-- MODAL -->
    <div id="team-modal-container"></div>
    <script>
        document.body.addEventListener('closeTeamModal', function() {
            const modal = document.getElementById('team_modal');
            if (modal) {
                modal.remove();
            }

            const container = document.getElementById('team-modal-container');
            if (container) {
                container.innerHTML = '';
            }
        });
    </script>
{% endblock %}
