{% extends "base.html" %}

{% block content %}
<div class="w-full min-w-0 space-y-3 overflow-x-hidden">
    <header class="px-1">
        <a href="{% url 'team-list' %}" class="inline-flex min-h-8 items-center gap-1 rounded-xl px-2 text-xs font-bold text-base-content/55 active:bg-base-200">
            <span class="text-lg leading-none">‹</span>
            Takımlar
        </a>
        <div class="mt-2">
            <p class="text-[10px] font-bold uppercase tracking-[0.16em] text-primary/70">Antrenman takibi</p>
            <h1 class="mt-0.5 text-xl font-bold tracking-tight">Katılım takibi</h1>
            <p class="mt-1 text-xs text-base-content/45">Tarih seçerek antrenman katılımını yönetin.</p>
        </div>
    </header>

    <form method="get" class="flex items-end gap-2 rounded-xl border border-base-300/90 bg-base-100 p-2.5 shadow-sm">
        <label class="form-control min-w-0 flex-1">
            <span class="mb-1 text-[10px] font-bold text-base-content/50">Antrenman tarihi</span>
            <input type="date" name="training_date" value="{{ selected_date|date:'Y-m-d' }}" class="input input-bordered h-10 min-h-0 w-full rounded-lg text-xs">
        </label>
        <button type="submit" class="btn btn-primary h-10 min-h-0 rounded-lg px-3 text-xs font-bold">Göster</button>
    </form>

    <section class="space-y-2">
        {% for schedule in schedules %}
            <button
                type="button"
                class="flex w-full items-center gap-3 rounded-xl border border-base-300/90 bg-base-100 p-3 text-left shadow-sm transition active:scale-[.99]"
                hx-get="{% url 'training-attendance-schedule' schedule.team.pk schedule.pk %}?training_date={{ selected_date|date:'Y-m-d' }}"
                hx-target="#attendance-modal-container"
                hx-swap="innerHTML">
                <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-base-200/80 text-primary/70" aria-hidden="true">{{ schedule.start_time|time:"H:i" }}</span>
                <span class="min-w-0 flex-1">
                    <span class="block truncate text-sm font-bold">{{ schedule.team.name }}</span>
                    <span class="mt-0.5 block text-xs text-base-content/45">{{ schedule.get_training_type_display }} · {{ schedule.location }}</span>
                </span>
                <span class="shrink-0 text-right">
                    <span class="block text-xs font-bold tabular-nums text-base-content/45">{{ schedule.start_time|time:"H:i" }} - {{ schedule.end_time|time:"H:i" }}</span>
                    {% include 'team/partials/training_attendance_count.html' with attended_count=schedule.attended_count absent_count=schedule.absent_count %}
                </span>
            </button>
        {% empty %}
            <div class="rounded-xl border border-dashed border-base-300 px-4 py-10 text-center text-xs text-base-content/45">
                Bugün için planlanmış antrenman bulunmuyor.
            </div>
        {% endfor %}
    </section>

</div>

<div id="attendance-modal-container"></div>

<script>
    function closeAttendanceModal() {
        document.querySelectorAll('#attendance_modal').forEach((modal) => modal.remove());
        const container = document.getElementById('attendance-modal-container');
        if (container) container.innerHTML = '';
    }

    function liftAttendanceModal(event) {
        const modal = event.target.id === 'attendance_modal'
            ? event.target
            : event.target.querySelector?.('#attendance_modal');

        if (modal && modal.parentElement !== document.body) {
            document.querySelectorAll('body > #attendance_modal').forEach((oldModal) => oldModal.remove());
            document.body.appendChild(modal);
        }
    }

    document.body.addEventListener('htmx:afterSwap', liftAttendanceModal);
    document.body.addEventListener('click', function (event) {
        const removeButton = event.target.closest('.remove-makeup-athlete');
        if (removeButton) {
            const athleteId = removeButton.dataset.athleteId;
            const form = removeButton.closest('form');
            removeButton.closest('.makeup-attendance-row, .attendance-row')?.remove();
            form?.querySelectorAll('input[name="makeup_athlete"], input[name="extra_athlete"]').forEach((input) => {
                if (input.value === athleteId) input.remove();
            });
            return;
        }

        const addButton = event.target.closest('.add-makeup-athlete');
        if (!addButton) return;

        const result = addButton.closest('div');
        const list = document.getElementById('attendance-athlete-list');
        const form = addButton.closest('form');
        if (!list || !form) return;

        const isMakeup = Boolean(result?.querySelector('.makeup-athlete-radio:checked'));
        const athleteId = addButton.dataset.athleteId;
        const athleteName = addButton.dataset.athleteName;

        list.querySelectorAll('.makeup-attendance-row').forEach((row) => {
            if (row.dataset.athleteId === athleteId) row.remove();
        });
        form.querySelectorAll('input[name="makeup_athlete"], input[name="extra_athlete"]').forEach((input) => {
            if (input.value === athleteId) input.remove();
        });

        const row = document.createElement('div');
        row.className = 'makeup-attendance-row attendance-row flex min-h-11 items-center gap-2 border-b border-base-200 bg-success/5 px-2.5 py-2';
        row.dataset.athleteId = athleteId;

        const name = document.createElement('span');
        name.className = 'min-w-0 flex-1 truncate text-sm font-semibold';
        name.textContent = athleteName;

        const status = document.createElement('span');
        status.className = 'text-[10px] font-semibold text-success';
        status.textContent = 'Katıldı';

        const hidden = document.createElement('input');
        hidden.type = 'hidden';
        hidden.name = isMakeup ? 'makeup_athlete' : 'extra_athlete';
        hidden.value = athleteId;

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove-makeup-athlete btn btn-ghost btn-xs h-7 min-h-0 rounded-lg px-2 text-[10px] font-bold text-error';
        remove.dataset.athleteId = athleteId;
        remove.textContent = 'Sil';

        row.append(name);
        if (isMakeup) {
            const note = document.createElement('span');
            note.className = 'text-[10px] font-bold text-primary';
            note.textContent = 'Telafi';
            row.append(note);
        }
        row.append(status, remove);
        list.prepend(row);
        form.appendChild(hidden);
        document.getElementById('makeup-athlete-search-results').innerHTML = '';
    });
    document.body.addEventListener('change', function (event) {
        const radio = event.target.closest('input[type="radio"][name^="attendance_"]');
        if (!radio) return;

        const row = radio.closest('.attendance-row');
        if (!row) return;

        row.classList.toggle('bg-success/5', radio.value === 'attended');
        row.classList.toggle('bg-error/5', radio.value === 'absent');
    });
    document.body.addEventListener('input', function (event) {
        const searchInput = event.target.closest('input[name="q"][minlength="3"]');
        if (searchInput && searchInput.value.trim().length < 3) {
            const results = document.getElementById('makeup-athlete-search-results');
            if (results) results.innerHTML = '';
        }
    });
    document.body.addEventListener('submit', function (event) {
        const form = event.target.closest('form[hx-post*="training-attendance-save"]');
        if (!form) return;

        form.querySelectorAll('input[name="absent_athletes"]').forEach((input) => input.remove());
        form.querySelectorAll('input[type="radio"][value="absent"]:checked').forEach((radio) => {
            const athleteId = radio.name.replace('attendance_', '');
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'absent_athletes';
            input.value = athleteId;
            form.appendChild(input);
        });
    });
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeAttendanceModal();
    });

    document.body.addEventListener('closeAttendanceModal', function () {
        closeAttendanceModal();
    });
</script>
{% endblock %}
