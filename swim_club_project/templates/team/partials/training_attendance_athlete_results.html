{% if search_query %}
    {% for athlete in search_results %}
        <div class="ui-list-item">
            <span>{{ athlete.get_full_name }}</span>
            <div>
                    <label>
                        <input type="radio"
                            value="yes"
                            class=""
                            name="makeup_athlete_{{ athlete.pk }}">
                        Telafi
                    </label>
                    <button type="button"
                            class="add-makeup-athlete ui-btn ui-btn-sm ui-btn-primary"
                            data-athlete-id="{{ athlete.pk }}"
                            data-athlete-name="{{ athlete.get_full_name }}">Ekle</button>
            </div>
        </div>
    {% empty %}
        <p>Sporcu bulunamadı.</p>
    {% endfor %}
{% endif %}
