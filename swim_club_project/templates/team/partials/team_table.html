<div id="team-table">
    {% for team in teams %}
        <a href="{% url 'team-detail' team.pk %}" class="ui-card">
            <div>
                <div>
                    <div>
                        <span>
                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                                <circle cx="9" cy="7" r="4" />
                                <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
                            </svg>
                        </span>
                        <h2>{{ team.name }}</h2>
                    </div>
                    <div>
                        {% if team.is_active %}
                            <span class="ui-badge ui-badge-success">Aktif</span>
                        {% else %}
                            <span class="ui-badge">Pasif</span>
                        {% endif %}
                    </div>
                </div>
                <p>{{ team.description|default:'Takım açıklaması bulunmuyor.' }}</p>
                <div>
                    <span>Antrenör Sayısı</span>
                    <span>{{ team.coaches.count }}</span>
                </div>
            </div>
        </a>
    {% empty %}
        <div class="ui-empty">
            <p class="ui-empty-description">Kayıt bulunamadı.</p>
        </div>
    {% endfor %}
</div>
