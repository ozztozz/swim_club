<div id="team-table" class="grid grid-cols-1 gap-2 p-3">
    {% for team in teams %}
    <!-- Mobil dokunma efekti (active:scale-[0.98]) ve daha dar kenar boşlukları eklendi -->
    <a href="{% url 'team-detail' team.pk %}" class="group card border border-base-300 bg-base-100 shadow-sm transition-all active:scale-[0.98] hover:border-primary/50">
        <div class="card-body p-4">
            
            <!-- Üst Bölüm: İkon, Takım Adı ve Durum -->
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                    <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-primary/10 text-primary">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </span>
                    <h2 class="text-base font-black text-base-content truncate">{{ team.name }}</h2>
                </div>
                
                <div class="shrink-0">
                    {% if team.is_active %}
                        <span class="badge badge-success badge-outline text-[10px] px-2 py-0 h-auto">Aktif</span>
                    {% else %}
                        <span class="badge badge-ghost text-[10px] px-2 py-0 h-auto">Pasif</span>
                    {% endif %}
                </div>
            </div>
            
            <!-- Açıklama Alanı (Mobil için satır kısıtlaması getirildi) -->
            <p class="text-xs text-base-content/60 mt-2 line-clamp-2 min-h-0">
                {{ team.description|default:'Takım açıklaması bulunmuyor.' }}
            </p>
            
            <!-- Alt Bölüm: Antrenör Bilgisi -->
            <div class="mt-2 flex items-center justify-between border-t border-base-100 pt-2 text-xs">
                <span class="text-base-content/50">Antrenör Sayısı</span>
                <span class="font-bold text-base-content bg-base-200 px-2 py-0.5 rounded-md">{{ team.coaches.count }}</span>
            </div>

        </div>
    </a>
    {% empty %}
        <div class="col-span-full py-12 text-center text-xs text-base-content/50">Kayıt bulunamadı.</div>
    {% endfor %}
</div>
