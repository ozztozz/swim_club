<div id="team-table" class="ui-card ui-scroll-list">
    {% for team in teams %}
        <a href="{% url 'team-detail' team.pk %}" class="ui-list-item">
            <div class="ui-list-content">
                <p class="ui-list-title">{{ team.name }}</p>
                <p class="ui-list-subtitle">{{ team.athlete_count }} sporcu · {{ team.coaches.all|length }} antrenör</p>
            </div>
            <div class="ui-list-end">
                <span class="ui-list-meta">{% if team.is_active %}Aktif{% else %}Pasif{% endif %}</span>
            </div>
        </a>
    {% empty %}
        <div class="ui-empty">
            <div class="ui-empty-icon">—</div>
            <p class="ui-empty-description">Kayıt bulunamadı.</p>
        </div>
    {% endfor %}
</div>
