<button type="button"
        class="flex w-full items-center gap-3 rounded-xl border p-3 text-left shadow-sm transition active:scale-[.99] {% if schedule.attended_count > 0 %}border-success/40 bg-success/5{% else %}border-base-300/90 bg-base-100{% endif %}"
        hx-get="{% url 'training-attendance-schedule' schedule.team.pk schedule.pk %}?training_date={{ selected_date|date:'Y-m-d' }}"
        hx-target="#attendance-modal-container"
        hx-swap="innerHTML">
    <span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl {% if schedule.attended_count > 0 %}bg-success/15 text-success{% else %}bg-base-200/80 text-primary/70{% endif %}"
          aria-hidden="true">{{ schedule.start_time|time:"H:i" }}</span>
    <span class="min-w-0 flex-1">
        <span class="block truncate text-sm font-bold">{{ schedule.team.name }}</span>
        <span class="mt-0.5 block truncate text-xs text-base-content/45">{{ schedule.get_training_type_display }} · {{ schedule.location }}</span>
    </span>
    <span class="shrink-0 text-right">
        <span class="block text-xs font-bold tabular-nums text-base-content/45">{{ schedule.start_time|time:"H:i" }} - {{ schedule.end_time|time:"H:i" }}</span>
        {% include "team/partials/training_attendance_count.html" with attended_count=schedule.attended_count absent_count=schedule.absent_count %}
    </span>
</button>
