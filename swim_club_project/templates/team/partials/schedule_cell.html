{% if schedules %}
    <div>
        {% for schedule in schedules %}
            <div>
                <div>
                    <span class="ui-badge {% if schedule.training_type == 'land' %}ui-badge-warning{% else %}ui-badge-primary{% endif %}"
                          title="{{ schedule.get_training_type_display }}">
                        {% if schedule.training_type == "land" %}K{% else %}Y{% endif %}
                    </span>
                    <div>
                        <button type="button"
                                class="ui-btn ui-btn-sm ui-btn-ghost"
                                hx-get="{% url 'team-schedule-update' team.pk schedule.pk %}"
                                hx-target="#schedule-modal-container"
                                hx-swap="innerHTML"
                                title="Düzenle"
                                aria-label="Antrenmanı düzenle">✎</button>
                        <form method="post"
                              hx-post="{% url 'team-schedule-delete' team.pk schedule.pk %}"
                              hx-target="#weekly-schedule-board"
                              hx-swap="outerHTML">
                            {% csrf_token %}
                            <button type="submit"
                                    class="ui-btn ui-btn-sm ui-btn-ghost text-danger-text"
                                    title="Sil"
                                    aria-label="{{ day_label }} antrenmanını sil">×</button>
                        </form>
                    </div>
                </div>
                <div>{{ schedule.start_time|time:"H:i" }} - {{ schedule.end_time|time:"H:i" }}</div>
                <div>{{ schedule.location }}</div>
            </div>
        {% endfor %}
    </div>
{% else %}
    <div>
        <span>OFF</span>
    </div>
{% endif %}
