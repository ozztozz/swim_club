{% if schedules %}
    <div class="grid min-w-0 grid-cols-2 {% if align_right %}justify-items-end{% else %}justify-items-start{% endif %} gap-1">
        {% for schedule in schedules %}
            <div class="{% if align_right and schedules|length == 1 %}col-start-2 {% endif %}min-w-0 max-w-full overflow-hidden rounded-md p-1 shadow-sm sm:p-1.5 {% if schedule.training_type == 'land' %}bg-warning/15{% else %}bg-info/15{% endif %}">
                <div class="flex items-start justify-between gap-0.5">
                    <div class="badge badge-xs shrink-0 border-0 text-[9px] font-black {% if schedule.training_type == 'land' %}bg-warning/30 text-warning-content{% else %}bg-info/25 text-info-content{% endif %}" title="{{ schedule.get_training_type_display }}">
                        {% if schedule.training_type == 'land' %}K{% else %}Y{% endif %}
                    </div>
                    <div class="flex shrink-0 items-center gap-0.5">
                        <button type="button" class="btn btn-ghost btn-xs h-5 min-h-0 w-5 rounded-md p-0 text-[10px] font-semibold leading-none text-primary" hx-get="{% url 'team-schedule-update' team.pk schedule.pk %}" hx-target="#schedule-modal-container" hx-swap="innerHTML" title="Düzenle" aria-label="Antrenmanı düzenle">✎</button>
                        <form method="post" hx-post="{% url 'team-schedule-delete' team.pk schedule.pk %}" hx-target="#weekly-schedule-board" hx-swap="outerHTML">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-ghost btn-xs h-5 min-h-0 w-5 rounded-md p-0 text-[10px] font-semibold leading-none text-error" title="Sil" aria-label="{{ day_label }} antrenmanını sil">×</button>
                        </form>
                    </div>
                </div>
                <div class="mt-0.5 truncate text-[8px] font-semibold tabular-nums sm:text-[9px]">{{ schedule.start_time|time:"H:i" }} - {{ schedule.end_time|time:"H:i" }}</div>
                <div class="mt-0.5 truncate text-[8px] text-base-content/50 sm:text-[9px]">{{ schedule.location }}</div>
            </div>
        {% endfor %}
    </div>
{% else %}
    <div class="rounded-md bg-base-200/40 px-1 py-1.5 text-center text-[9px] font-semibold text-base-content/35">OFF</div>
{% endif %}
