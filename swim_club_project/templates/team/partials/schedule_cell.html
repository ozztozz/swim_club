<div class="ui-week-session">
    <span class="ui-week-type {% if schedule.training_type == 'land' %}is-land{% endif %}"
          title="{{ schedule.get_training_type_display }}">{% if schedule.training_type == "land" %}K{% else %}Y{% endif %}</span>

    <div class="ui-list-content">
        <p class="ui-list-title tabular-nums">{{ schedule.start_time|time:"H:i" }} – {{ schedule.end_time|time:"H:i" }}</p>
        <p class="ui-list-subtitle">{{ period }}{% if schedule.location %} · {{ schedule.location }}{% endif %}</p>
    </div>

    <div class="ui-week-actions">
        <button type="button"
                class="ui-week-icon"
                hx-get="{% url 'team-schedule-update' team.pk schedule.pk %}"
                hx-target="#modal-container"
                hx-swap="innerHTML"
                title="Düzenle"
                aria-label="Antrenmanı düzenle">✎</button>
        <form method="post"
              hx-post="{% url 'team-schedule-delete' team.pk schedule.pk %}"
              hx-target="#weekly-schedule-board"
              hx-swap="outerHTML">
            {% csrf_token %}
            <button type="submit"
                    class="ui-week-icon is-danger"
                    title="Sil"
                    aria-label="{{ day_label }} antrenmanını sil">×</button>
        </form>
    </div>
</div>
