        <div class="-mb-2 flex justify-end">
            <button type="button" class="btn btn-circle btn-ghost h-8 w-8 min-h-0 text-sm" onclick="closeAttendanceModal()" aria-label="Kapat">✕</button>
        </div>
        {% include 'team/partials/training_attendance_panel.html' %}
    </div>
</dialog>
