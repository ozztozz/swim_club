<dialog id="team_modal" class="modal modal-open">
    <div class="modal-box">
        <h3 class="text-xl font-black">Takımı sil?</h3>
        <p class="py-4"><strong>{{ team.name }}</strong> takımı ve antrenör ataması silinecek. Bu işlem geri alınamaz.</p>
        <form method="post" hx-post="{% url 'team-delete' team.pk %}" hx-target="#team-table" hx-swap="outerHTML">
            {% csrf_token %}<div class="modal-action"><button type="button" class="btn btn-ghost" onclick="document.getElementById('team_modal').remove()">İptal</button><button class="btn btn-error" type="submit">Sil</button></div>
        </form>
    </div>
</dialog>
