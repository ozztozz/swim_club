<span id="attendance-summary-{{ schedule.pk }}"
      hx-swap-oob="outerHTML"
      aria-label="{{ attended_count|default:'0' }} katıldı, {{ absent_count|default:'0' }} katılmadı"
      class="ui-badge {% if schedule.is_attendance_taken %}ui-badge-success{% else %}ui-badge-neutral{% endif %} text-[11px] px-2.5 py-0.5">
    👤 <span class="ui-text-success">{{ attended_count|default:"0" }}</span> / <span class="ui-text-danger">{{ absent_count|default:"0" }}</span>
</span>
