{% extends "base.html" %}
{% block content %}
    <div class="dashboard">
        <header class="ui-teams-head">
            <div>
                <p class="ui-teams-eyebrow">Kulüp yönetimi</p>
                <h1 class="ui-teams-title">Takımlar</h1>
            </div>
            <div class="ui-teams-actions">
                <a href="{% url 'fee-management' %}" class="ui-btn ui-btn-sm ui-btn-secondary">Ücret Yönetimi</a>
                <button type="button"
                        class="ui-btn ui-btn-sm ui-btn-primary"
                        hx-get="{% url 'team-create' %}"
                        hx-target="#modal-container"
                        hx-swap="innerHTML">
                    <span class="ui-btn-plus">+</span>
                    Yeni Takım
                </button>
            </div>
        </header>

        <form method="get" class="ui-teams-toolbar">
            <label class="ui-search-field ui-teams-search">
                <span class="ui-search-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7" />
                        <path d="m20 20-3.5-3.5" />
                    </svg>
                </span>
                <input type="search" name="q" value="{{ query }}" placeholder="Takım ara" class="ui-input ui-search-input" autocomplete="off">
            </label>
            <input type="hidden" name="status" value="{{ status }}">
            <nav class="ui-teams-tabs" aria-label="Durum filtresi">
                <a href="?status=active{% if query %}&q={{ query|urlencode }}{% endif %}" class="ui-teams-tab{% if status == 'active' %} is-active{% endif %}">Aktif</a>
                <a href="?status=inactive{% if query %}&q={{ query|urlencode }}{% endif %}" class="ui-teams-tab{% if status == 'inactive' %} is-active{% endif %}">Pasif</a>
                <a href="?status=all{% if query %}&q={{ query|urlencode }}{% endif %}" class="ui-teams-tab{% if status == 'all' %} is-active{% endif %}">Tümü</a>
            </nav>
        </form>

        {% include "team/partials/team_table.html" %}
    </div>
{% endblock %}
