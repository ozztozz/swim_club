{% extends "base.html" %}
{% block content %}
    <div class="dashboard">
        <!-- YENİ CAM EFEKTİ (GLASSMORPHISM) BAŞLIK KARTI -->
        <header class="profile-hero-card mb-6" style="background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 24px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.23);">
            <div class="page-header-main" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
                <div>
                    <p class="page-eyebrow ui-text-primary" style="margin: 0 0 4px 0; font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Kulüp yönetimi</p>
                    <h1 class="page-title" style="margin: 0 0 4px 0; font-size: 1.75rem; font-weight: 700;">Takımlar</h1>
                    <p class="page-description" style="margin: 0; opacity: 0.8; font-size: 0.95rem;">Takımları, antrenörleri ve aylık aidatlarını yönetin.</p>
                </div>

                <!-- AKSİYONLAR -->
                <div class="ui-section-actions" style="display: flex; gap: 10px; align-items: center;">
                    <a href="{% url 'fee-management' %}"
                       class="ui-btn ui-btn-sm ui-btn-secondary">
                        Ücret Yönetimi
                    </a>
                    <button type="button"
                            class="ui-btn ui-btn-sm ui-btn-primary"
                            hx-get="{% url 'team-create' %}"
                            hx-target="#modal-container"
                            hx-swap="innerHTML">
                        <span style="font-size: 1.1rem; line-height: 1; margin-right: 4px;">+</span>
                        Yeni Takım
                    </button>
                </div>
            </div>
        </header>

        <!-- FİLTRE + TAKIMLAR BÖLÜMÜ -->
        <section class="ui-section profile-hero-card" style="background: linear-gradient(135deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.03)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; padding: 24px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);">


            <!-- TAKIM LİSTESİ -->
            <div style="margin-top: 24px;">{% include "team/partials/team_table.html" %}</div>
        </section>
    </div>


{% endblock %}
